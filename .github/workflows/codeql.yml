name: CodeQL

# ADR-0020 professional baseline. This is a private repository that may not
# have GitHub code scanning, so nothing is uploaded to the Security tab
# (upload: never). Instead the job reads the SARIF itself, fails if it holds
# any result, and keeps the SARIF as a workflow artifact.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "11 21 * * 0"  # Sunday 21:11 UTC

permissions:
  contents: read
  # The analyze step reads this workflow run's metadata; on a private
  # repository that needs actions: read.
  actions: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: sarif-results

      - name: Fail if CodeQL reported anything
        run: |
          python3 - <<'PY'
          import glob
          import json
          import sys

          files = sorted(glob.glob("sarif-results/*.sarif"))
          if not files:
              sys.exit("No SARIF file was produced.")
          found = 0
          for path in files:
              with open(path, encoding="utf-8") as handle:
                  sarif = json.load(handle)
              for run in sarif.get("runs", []):
                  for result in run.get("results", []):
                      loc = (result.get("locations") or [{}])[0].get("physicalLocation", {})
                      uri = loc.get("artifactLocation", {}).get("uri", "?")
                      line = loc.get("region", {}).get("startLine", "?")
                      print(f"{result.get('ruleId', '?')}  {uri}:{line}  {result.get('message', {}).get('text', '')}")
                      found += 1
          print(f"{found} CodeQL result(s).")
          sys.exit(1 if found else 0)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: warn
