name: Tests

# The three test layers (spec, benchmark, regression), lint, strict typing,
# the PostgreSQL store tests and the installed-artifact check (ADR-0011),
# on every pull request to main and every push to main. ADR-0020's active
# main ruleset requires the test and pilot-image jobs; #168 observed that a
# failing required test blocks merging. Never bypass these checks.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Fail, rather than skip to green, if the PostgreSQL binaries are missing.
      POLTIKA_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"

      - name: Put the runner's PostgreSQL server binaries on PATH
        run: |
          set -euo pipefail
          PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          "$PG_BIN/postgres" --version
          echo "$PG_BIN" >> "$GITHUB_PATH"

      - name: Install
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run --extra dev ruff check src tests

      - name: Mypy (strict)
        run: uv run --extra dev mypy --strict src

      - name: Evidence coverage (v0.1.5 Phase 1)
        run: uv run --extra dev python -m poltika.engines.assurance.evidence policy_specs/working_for_families policy_specs/accommodation_supplement

      - name: Tests (spec, benchmark, regression, PostgreSQL store)
        run: uv run --extra dev pytest -q

      - name: Installed artifact (wheel, API, store and provenance probe)
        run: uv run --extra dev pytest -q -m installed_artifact

      - name: Code replay (stored run on its retained revision, Task 32.4)
        env:
          POLTIKA_REQUIRE_CODE_REPLAY: "1"
        run: uv run --extra dev pytest -q -m code_replay

  pilot-image:
    # v0.1.5 Task 8.1: the pilot container builds and serves a household
    # calculation and the analyst page. The scenario store is exercised by
    # the test job above; here the image runs without a database.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build the pilot image
        run: docker build -t poltika:pilot .

      - name: Smoke test
        run: |
          set -euo pipefail
          # Without a password the image refuses to start (api/access.py).
          docker run --name poltika-open poltika:pilot && exit 1 || true
          docker logs poltika-open > poltika-open.log 2>&1
          grep -q POLTIKA_ACCESS_PASSWORD poltika-open.log
          docker run -d --name poltika -p 8000:8000 -e POLTIKA_ACCESS_PASSWORD=ci-pass poltika:pilot
          for i in $(seq 1 60); do curl -sf localhost:8000/healthz >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/analyst)" = 401
          C="-u pilot:ci-pass"
          # Saved first: grep -q exits at its first match, which would cut
          # curl's write short (exit 23) under pipefail.
          curl -sf $C localhost:8000/analyst > analyst.html
          grep -q "Poltika analyst" analyst.html
          curl -sf $C localhost:8000/analyst/examples > examples.json
          python3 -c "import json; json.dump(json.load(open('examples.json'))[1]['request'], open('request.json', 'w'))"
          curl -sf $C -X POST -H 'content-type: application/json' -d @request.json \
            localhost:8000/household/calculate > response.json
          python3 -c "import json; r = json.load(open('response.json')); assert r['accommodation_supplement']['outcome'] == 'calculated'; assert r['explanations']"
          # The built-in synthetic population serves the microsimulation page.
          curl -sf $C localhost:8000/microsim/population > population.json
          python3 -c "import json; assert json.load(open('population.json'))['population_id'] == 'nz_synthetic_development'"
          test "$(curl -s $C -o /dev/null -w '%{http_code}' localhost:8000/scenarios/$(printf '0%.0s' $(seq 1 64)))" = 503
