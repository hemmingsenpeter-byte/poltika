name: Tests

# The three test layers (spec, benchmark, regression), lint, strict typing,
# the PostgreSQL store tests and the installed-artifact check (ADR-0011),
# on every pull request to main and every push to main. ADR-0020's active
# main ruleset requires the test and pilot-image jobs; #168 observed that a
# failing required test blocks merging. Never bypass these checks.
#
# Change classification (D43): `test` always runs, because tests also read
# repository documents. `web` and `pilot-image` run on a pull request only
# when it changes one of their inputs, and always on a push to main. A
# skipped job reports success, so the classification fails towards running:
# if `changes` fails or cannot tell, both run.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels the older run. Pushes to main and
# scheduled runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.diff.outputs.web }}
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the change
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # changed <paths...>: "false" only when git proves none changed.
          changed() {
            if [ "$EVENT" != pull_request ] || [ -z "$MERGE_BASE" ]; then echo true; return; fi
            if git diff --quiet "$MERGE_BASE" "$HEAD_SHA" -- "$@"; then echo false; else echo true; fi
          }
          MERGE_BASE=""
          if [ "$EVENT" = pull_request ]; then
            MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA") || MERGE_BASE=""
          fi
          # The web job: the app, and the backend its generated API types come from.
          echo "web=$(changed web src scripts/development/dump_openapi.py pyproject.toml uv.lock .github/workflows/tests.yml)" >> "$GITHUB_OUTPUT"
          # The pilot image: the Dockerfile's COPY sources and this workflow's smoke test.
          echo "image=$(changed Dockerfile .dockerignore pyproject.toml uv.lock README.md src policy_specs deploy data/metadata model_registry web .github/workflows/tests.yml)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    env:
      # Fail, rather than skip to green, if the PostgreSQL binaries are missing.
      POLTIKA_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Put the runner's PostgreSQL server binaries on PATH
        run: |
          set -euo pipefail
          PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          "$PG_BIN/postgres" --version
          echo "$PG_BIN" >> "$GITHUB_PATH"
          # pytest's temporary directories, and so the test server's data
          # directory, live under this job's temporary directory.
          echo "PYTEST_DEBUG_TEMPROOT=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run --extra dev ruff check src tests

      - name: Mypy (strict)
        run: uv run --extra dev mypy --strict src

      - name: Evidence coverage (v0.1.5 Phase 1)
        run: uv run --extra dev python -m poltika.engines.assurance.evidence policy_specs/working_for_families policy_specs/accommodation_supplement

      - name: Tests (spec, benchmark, regression, PostgreSQL store)
        # Parallel workers (pytest-xdist, D43); each starts its own
        # throwaway PostgreSQL server on a free port.
        run: uv run --extra dev pytest -q -n auto

      - name: Installed artifact (wheel, API, store and provenance probe)
        run: uv run --extra dev pytest -q -m installed_artifact

      - name: Code replay (stored run on its retained revision, Task 32.4)
        env:
          POLTIKA_REQUIRE_CODE_REPLAY: "1"
        run: uv run --extra dev pytest -q -m code_replay

  web:
    # Task B0.1.3 (ADR-0023): the web app's own checks: install, lint,
    # types, tests, the static export, and that the generated API types
    # still match the Pydantic models. Skipped on a pull request that
    # changes none of its inputs (see `changes`).
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      # Node 22, as the image builds on.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Tests (formatters, services, pages, copy scan)
        working-directory: web
        run: npm test

      - name: Build (static export)
        working-directory: web
        run: npm run build

      - name: Generated API types match the backend
        run: |
          set -euo pipefail
          uv sync --locked --extra dev
          uv run --extra dev python scripts/development/dump_openapi.py
          (cd web && npm run gen:api)
          git diff --exit-code web/openapi.json web/src/api/schema.gen.ts

  pilot-image:
    # v0.1.5 Task 8.1: the pilot container builds and serves a household
    # calculation and the analyst page. The scenario store is exercised by
    # the test job above; here the image runs without a database. Skipped
    # on a pull request that changes no image input (see `changes`).
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.image != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the pilot image
        run: docker build -t poltika:pilot .

      - name: Smoke test
        run: |
          set -euo pipefail
          # Without a password the image refuses to start (api/access.py).
          docker run --name poltika-open poltika:pilot && exit 1 || true
          docker logs poltika-open > poltika-open.log 2>&1
          grep -q POLTIKA_ACCESS_PASSWORD poltika-open.log
          docker run -d --name poltika -p 8000:8000 -e POLTIKA_ACCESS_PASSWORD=ci-pass poltika:pilot
          for i in $(seq 1 60); do curl -sf localhost:8000/healthz >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/analyst)" = 401
          C="-u pilot:ci-pass"
          # Saved first: grep -q exits at its first match, which would cut
          # curl's write short (exit 23) under pipefail.
          curl -sf $C localhost:8000/analyst > analyst.html
          grep -q "Poltika analyst" analyst.html
          curl -sf $C localhost:8000/analyst/examples > examples.json
          python3 -c "import json; json.dump(json.load(open('examples.json'))[1]['request'], open('request.json', 'w'))"
          curl -sf $C -X POST -H 'content-type: application/json' -d @request.json \
            localhost:8000/household/calculate > response.json
          python3 -c "import json; r = json.load(open('response.json')); assert r['accommodation_supplement']['outcome'] == 'calculated'; assert r['explanations']"
          # The built-in synthetic population serves the microsimulation page.
          curl -sf $C localhost:8000/microsim/population > population.json
          python3 -c "import json; assert json.load(open('population.json'))['population_id'] == 'nz_synthetic_development'"
          test "$(curl -s $C -o /dev/null -w '%{http_code}' localhost:8000/scenarios/$(printf '0%.0s' $(seq 1 64)))" = 503
          # Task B0.1.1: the catalogue is served from the image's own copies.
          curl -sf $C localhost:8000/api/v1/models > models.json
          python3 -c "import json; assert 'wff_engine' in [m['id'] for m in json.load(open('models.json'))['models']]"
          curl -sf $C localhost:8000/api/v1/datasets > datasets.json
          python3 -c "import json; assert json.load(open('datasets.json'))['datasets']"
          curl -sf $C localhost:8000/api/v1/evidence > evidence.json
          python3 -c "import json; assert all(not p['problems'] for p in json.load(open('evidence.json')))"
          # Task B0.1.3: the web app is served from the image, behind the password.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' localhost:8000/)" = 401
          curl -sf $C -H 'Accept: text/html' localhost:8000/ > home.html
          grep -q 'What do you want to understand' home.html
          test "$(curl -s $C -o /dev/null -w '%{http_code}' -H 'Accept: text/html' localhost:8000/models)" = 200
