name: Links

# ADR-0020 professional baseline. The required check is offline: relative
# links and heading anchors only, so it is deterministic and never contacts
# an external site. The weekly external check only reports.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "37 22 * * 0"  # Sunday 22:37 UTC

permissions:
  contents: read

# Most jobs run on the self-hosted runner (decision log D21), which works
# one job at a time, so a newer push to a pull request cancels the older
# run. Pushes to main and scheduled runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links:
    name: links
    if: github.event_name != 'schedule'
    # lychee-action downloads only Linux binaries, so on the self-hosted Mac
    # (D21) the same lychee version it pins is fetched and hash-checked here.
    runs-on: [self-hosted, poltika]
    env:
      LYCHEE_VERSION: v0.24.2
      LYCHEE_SHA256: 887503a9cff667d322b8d0892b40bf49976eb9507af8483220a3706cdad55978
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lychee
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/lychee"
          mkdir -p "$DIR"
          curl -sSfL -o "$DIR/lychee.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-apple-darwin.tar.gz"
          echo "$LYCHEE_SHA256  $DIR/lychee.tar.gz" | shasum -a 256 -c -
          tar -xzf "$DIR/lychee.tar.gz" -C "$DIR"
          BIN=$(dirname "$(find "$DIR" -type f -name lychee | head -1)")
          "$BIN/lychee" --version
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Check relative links and anchors offline
        run: lychee --offline --include-fragments --no-progress '**/*.md'

  external-links:
    name: external-links (report only)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 2 --timeout 30 '**/*.md'
          fail: false
          jobSummary: true
