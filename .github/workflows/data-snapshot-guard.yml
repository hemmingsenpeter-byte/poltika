name: Data Snapshot Guard

# v0.2 Task 1.3. Raw snapshots and their manifests are immutable: a
# correction is a new raw_snapshot_version, never an edit (Data Acquisition
# Doctrine). Unlike the statutory-value guard, this check fails the run.
# Adding files is fine.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Most jobs run on the self-hosted runner (decision log D21), which works
# one job at a time, so a newer push to a pull request cancels the older
# run. Pushes to main and scheduled runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-immutable-snapshots:
    # Fork pull requests never reach the self-hosted runner (audit A1).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, poltika]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fail on edited, renamed or deleted snapshots
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          CHANGED=$(git diff --name-status --no-renames --diff-filter=MDT "$MERGE_BASE" "$HEAD_SHA" -- \
            'data/raw/' 'data/metadata/datasets/' \
            ':(exclude)data/raw/README.md' ':(exclude)data/metadata/datasets/README.md')
          if [ -n "$CHANGED" ]; then
            echo "::error title=Immutable data snapshot changed::A committed raw snapshot or manifest was modified or deleted. Add a new raw_snapshot_version instead."
            {
              echo "## Immutable data snapshots changed"
              echo
              echo "$CHANGED" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "No committed data snapshot changed." >> "$GITHUB_STEP_SUMMARY"
