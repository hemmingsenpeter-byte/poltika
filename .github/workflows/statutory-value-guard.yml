name: Statutory Value Guard

# Reports protected changes for human/source review; it does not decide
# whether a changed value is acceptable. ADR-0020's active main ruleset
# requires this check to run successfully. #168 observed required-check
# blocking; ADR-0007's earlier platform limitation is historical.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-protected-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for statutory-value file changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Diff from the actual merge-base, not base.sha directly — base.sha
          # is main's tip as of the PR event, which can be stale (and so
          # under- or over-report the diff) if main has moved since the PR
          # branched. This is what ADR-0007 fixed from the original version.
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          # Protected expected values: the policy values, the spec, benchmark
          # and golden-household expectations, and the frozen golden results
          # (regenerated by POLTIKA_UPDATE_GOLDEN_SNAPSHOT=1, so a change there
          # must be as visible as a change to the cases it freezes).
          CHANGED=$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA" -- \
            'policy_specs/*/benchmarks.yaml' \
            'policy_specs/*/spec_cases.yaml' \
            'policy_specs/*/golden_households.yaml' \
            'policy_specs/*/policy.yaml' \
            'tests/fixtures/golden_*.json')
          # The texts those values are cited from and interpreted by. Not
          # values themselves, but every run binds their hashes (Task 31), so
          # an edit changes what a provenance report resolves against.
          INTERPRETATION=$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA" -- \
            'policy_specs/*/sources.yaml' \
            'policy_specs/*/specification.md' \
            'policy_specs/*/decisions/*')
          if [ -n "$CHANGED" ]; then
            echo "::warning title=Statutory-value files changed::This PR changes protected statutory-value files (ADR-0007). Review before merging; this check reports the change and must complete successfully under ADR-0020."
            {
              echo "## Statutory-value files changed"
              echo
              echo "Per ADR-0007/0020, review these before merging; a successful guard run reports changes and does not approve their values:"
              echo
              echo "$CHANGED" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No protected statutory-value files changed." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$INTERPRETATION" ]; then
            echo "::warning title=Source, specification or decision files changed::This PR changes the sources, specification or decisions the statutory values are cited from. Review before merging; this check reports the change and must complete successfully under ADR-0020."
            {
              echo
              echo "## Source, specification or decision files changed"
              echo
              echo "$INTERPRETATION" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
