name: Security

# ADR-0020 professional baseline. Audits the locked third-party dependencies
# (not the project itself) against the PyPI advisory database. It also runs
# weekly, because a new advisory can land without any change here.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 20 * * 0"  # Sunday 20:23 UTC

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Export the locked dependencies
        run: |
          uv export --locked --all-extras --no-hashes --no-emit-project -o requirements-audit.txt

      - name: Audit them
        # --no-deps: the lock already pins the full tree, so nothing is
        # resolved again. --strict fails if a package cannot be audited.
        run: |
          uvx pip-audit@2.9.0 -r requirements-audit.txt --no-deps --disable-pip --strict
