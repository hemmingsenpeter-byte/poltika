name: Security

# ADR-0020 professional baseline. Audits the locked third-party dependencies
# (not the project itself) against the PyPI advisory database. It also runs
# weekly, because a new advisory can land without any change here.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 20 * * 0"  # Sunday 20:23 UTC

permissions:
  contents: read

# Most jobs run on the self-hosted runner (decision log D21), which works
# one job at a time, so a newer push to a pull request cancels the older
# run. Pushes to main and scheduled runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip-audit:
    name: pip-audit
    # Fork pull requests never reach the self-hosted runner (audit A1).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, poltika]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Export the locked dependencies
        run: |
          uv export --locked --all-extras --no-hashes --no-emit-project -o requirements-audit.txt

      - name: Audit them
        # python -m: uv's launcher script needs realpath, which macOS 12
        # (the self-hosted runner, D21) lacks.
        # --no-deps: the lock already pins the full tree, so nothing is
        # resolved again. --strict fails if a package cannot be audited.
        run: |
          uvx --from pip-audit@2.9.0 python -m pip_audit -r requirements-audit.txt --no-deps --disable-pip --strict

  npm-audit:
    # Task B0.1.3 (ADR-0023): the web app's runtime dependencies, which
    # pip-audit does not cover. Development tools are not shipped, so only
    # the production tree is audited.
    name: npm audit
    # Fork pull requests never reach the self-hosted runner (audit A1).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, poltika]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node version
        run: node --version

      - name: Audit the production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
