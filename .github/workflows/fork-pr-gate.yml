name: Fork PR gate

# Audit A1 (PR #191, reviews/2026-10-11-audit-191-verification.md): the
# self-hosted runner executes pull-request code, so every self-hosted job
# is skipped for a pull request from a fork. A skipped required check
# counts as passing, so this job fails loudly instead, on a GitHub-hosted
# runner, and only for fork pull requests (the job is skipped otherwise,
# so it spends no minutes on ordinary pull requests). Not a required check.
# A fork pull request needs a maintainer to review and re-push the branch
# inside this repository before it can be tested.

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  fork-pr-blocked:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Refuse fork pull requests
        run: |
          echo "Fork pull requests do not run on the self-hosted runner." >&2
          echo "A maintainer must review the change and push it to a branch in this repository." >&2
          exit 1
