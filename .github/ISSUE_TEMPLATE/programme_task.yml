name: Programme task
description: A step or task from BUILD_PLAN_PROGRAMME.md.
labels: ["programme"]
body:
  - type: input
    id: task_id
    attributes:
      label: Step and task id
      description: From BUILD_PLAN_PROGRAMME.md, for example "Step 3, Task 3.1".
    validations:
      required: true
  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: The plan's done-when, in a testable form.
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Tier
      description: See adr/0020-delegated-acceptance.md. Tier C goes to PETE_QUEUE.md.
      options:
        - A (decide and merge)
        - B (decide, log in docs/decision_log.md)
        - C (Pete decides)
    validations:
      required: true
  - type: textarea
    id: reads
    attributes:
      label: Files to read first
