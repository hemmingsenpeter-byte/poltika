name: Security report (private repository)
description: A minimal security report, visible to every repository collaborator.
body:
  - type: markdown
    attributes:
      value: |
        This repository is currently private. This report is visible to all
        repository collaborators, not only its owner. Address the report to
        @hemmingsenpeter-byte. Do not include secrets, personal data, unit
        records or microdata. Ask for an existing confidential channel if
        technical details need narrower disclosure. See SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Minimal description and affected component
      description: Give enough context to triage without exposing sensitive details.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Visibility and privacy
      options:
        - label: I understand every repository collaborator can read this report and it contains no secrets, personal data, unit records or microdata.
          required: true
