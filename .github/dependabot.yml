# ADR-0020 professional baseline: keep locked dependencies and pinned
# actions current. Minor and patch updates are grouped into one PR per
# ecosystem; major updates arrive one at a time so they get a real review.
#
# PAUSED on 10 October 2026 at Pete's instruction (docs/decision_log.md D27).
# The reason then, the single self-hosted runner and the Actions budget
# (D21), went with D41: CI is GitHub-hosted and the repository public.
# `open-pull-requests-limit: 0` disables version updates and keeps this
# configuration. To re-enable, restore a limit per ecosystem.
# Revisit at B0.1.7 deployment; suggested settings then are a monthly
# schedule, a limit of 1-2 per ecosystem, and `ignore` for semver-major.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      uv-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
