# Poltika model registry (BUILD_PLAN_PROGRAMME.md Task 1.5).
# Rules: doctrine/model-governance.md. Cards in cards/ are generated from this
# file: python -m poltika.engines.assurance.model_cards
# Accepted under Pete's 5 October 2026 closeout instruction after GPT/Codex
# review. Every claim links repository evidence; "unknown" is not backfilled.
schema_version: "0.1"

# Validation levels, least mature first. A label on an output is the level of
# the least mature model it relies on (doctrine/model-governance.md).
validation_levels:
  - not_validated
  - spec_validated

models:
  - id: wff_engine
    name: Working for Families engine
    kind: engine
    version: "0.1.0"
    version_basis: >-
      Package version in pyproject.toml. The engine has no version of its own.
      Each run records the source commit (src/poltika/scenarios/record.py,
      CodeIdentity). Policy version working_for_families 0.1.0
      (policy_specs/working_for_families/policy.yaml).
    owner: >-
      Pete (accountable model owner and decisions); Claude Code (implementation);
      GPT/Codex (sources, interpretation, independent review). Assigned under
      Pete's 5 October 2026 closeout authority; doctrine/model-governance.md.
    purpose: >-
      Calculates one household's Working for Families components (family tax
      credit, in-work tax credit, minimum family tax credit, Best Start) for the
      2026-27 tax year, from the approved parameters and the caller's asserted
      facts. A component the facts or parameters cannot settle is needs_review
      or unsupported, never a guessed number.
    entry_points:
      - {module: poltika.engines.simulator.wff, function: calculate_wff}
      - {module: poltika.engines.simulator.wff, function: run_wff_module}
    depends_on: []
    validation:
      level: spec_validated
      basis: >-
        Passes hand-calculated spec cases and published IRD worked examples for
        its declared supported domain. It has no empirical estimate and no
        predictive record. The validation framework (current Phase C; legacy Step 6) does not exist yet.
      cases:
        - {kind: spec_cases, path: policy_specs/working_for_families/spec_cases.yaml, count: 23}
        - {kind: benchmarks, path: policy_specs/working_for_families/benchmarks.yaml, count: 9}
        - {kind: golden_households, path: policy_specs/wff_as_interaction/golden_households.yaml, count: 9}
        - {kind: golden_snapshot, path: tests/fixtures/golden_results_v0_1.json, count: 9}
      tests:
        - tests/unit/engines/simulator/test_wff.py
        - tests/unit/engines/simulator/test_wff_spec_cases.py
        - tests/unit/engines/simulator/test_wff_benchmarks.py
        - tests/unit/engines/simulator/test_wff_module.py
        - tests/regression/test_known_historical_issues.py
        - tests/regression/test_golden_result_snapshot.py
      reviews:
        - reviews/2026-09-25-task34-3-codex.md
        - review_packets/wff_task17.md
        - review_packets/review_queue.md
      open_items:
        - >-
          The in-work tax credit base rate is needs_review, so the in-work tax
          credit and the WFF total are never calculated (docs/releases/V0_1_LIMITATIONS.md).
    evidence_classes_consumed: [Rule, Scenario]
    evidence_note: >-
      Rule: parameters with review_status approved and a cited source
      (policy_specs/working_for_families/policy.yaml). Scenario: the caller's
      asserted household facts (doctrine/epistemic-constitution.md, decision P2).
      Its results are Model output. The in_work_base parameter is
      needs_review and gates the in-work tax credit.
    limitations:
      - text: Facts are asserted, not verified. A result is a conditional simulation, not an entitlement decision.
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: Only the 2026-27 tax year is covered. Another period is needs_review or has no rate for the date.
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: >-
          Not modelled: relationship change, a child qualifying for part of the
          year, a birth or third birthday in the year, the MC 9 extension past age 18.
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: >-
          Not modelled: shared care, a competing claimant or MC 7 allocation, a
          residence route other than MC 5(2).
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: >-
          Not modelled: MD 14/15 protected family tax credit, the direct-abatement
          pathway, MG 4 protected Best Start months, a Tax Administration Act s 80KW
          extra-instalment year.
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: Best Start covers one birth cohort and one child in it.
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: Net family scheme income must be supplied and attested as an ME 3 derivation. Poltika does not derive it.
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: Instalments, overpayments and debts are not modelled.
        source: docs/releases/V0_1_LIMITATIONS.md
    model_risks:
      - text: >-
          The in-work tax credit base rate for 2026-27 can be reversed early by
          Order in Council, so the rate is gated and never calculated.
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: >-
          Evidenced ineligibility is $0 only where WFF DEC-001 says so. The
          decision is recorded and was open to the deferred GPT/Codex audit.
        source: policy_specs/working_for_families/decisions/DEC-001-evidenced-ineligibility-outcome.md
    change_log:
      - date: "2026-09-21"
        change: Task 12, the pure calculate_wff() function (commit 5a94acd, PR #14).
        why: First implementation of the approved Task 10 scoped contract.
        evidence: policy_specs/working_for_families/spec_cases.yaml
        validation_rerun: unknown (recorded before change records existed)
        approval: unknown (recorded before change records existed)
      - date: "2026-09-22"
        change: Task 20, the run_wff_module() integration entry point (commit f0566e6, PR #21).
        why: Module entry point over the policy loader and calculator (ARCHITECTURE.md module contract).
        evidence: tests/unit/engines/simulator/test_wff_module.py
        validation_rerun: unknown (recorded before change records existed)
        approval: unknown (recorded before change records existed)
      - date: "2026-09-25"
        change: >-
          Calculation steps in the trace and structured review reasons (commits
          0f81e2e, f8b4b3a). No calculated amount changed (CHANGELOG.md).
        why: v0.1.5 explainability and structured needs_review reasons.
        evidence: docs/releases/V0_1_5_GATE.md
        validation_rerun: tests/acceptance/test_v0_1_5_release_gate.py (gate row "v0.1 results unchanged")
        approval: unknown (recorded before change records existed)
      - date: "2026-10-05"
        change: Registered in the model registry (Task 1.5). No code change.
        why: BUILD_PLAN_PROGRAMME.md Task 1.5.
        evidence: model_registry/registry.yaml
        validation_rerun: pytest -q, including tests/unit/engines/assurance/test_model_registry.py
        approval: Pete, 5 October 2026 closeout instruction to accept the best options; reviews/2026-10-05-pr164.md

  - id: as_engine
    name: Accommodation Supplement engine
    kind: engine
    version: "0.1.0"
    version_basis: >-
      Package version in pyproject.toml. The engine has no version of its own.
      Each run records the source commit (src/poltika/scenarios/record.py,
      CodeIdentity). Policy version accommodation_supplement 0.1.1
      (policy_specs/accommodation_supplement/policy.yaml).
    owner: >-
      Pete (accountable model owner and decisions); Claude Code (implementation);
      GPT/Codex (sources, interpretation, independent review). Assigned under
      Pete's 5 October 2026 closeout authority; doctrine/model-governance.md.
    purpose: >-
      Calculates one claimant's weekly Accommodation Supplement for an explicit
      assessment week, from the approved parameters and the caller's asserted
      facts. A component the facts or parameters cannot settle is needs_review
      or unsupported, never a guessed number.
    entry_points:
      - {module: poltika.engines.simulator.accommodation_supplement, function: calculate_accommodation_supplement}
      - {module: poltika.engines.simulator.accommodation_supplement, function: run_as_module}
    depends_on: []
    validation:
      level: spec_validated
      basis: >-
        Passes hand-calculated spec cases and MSD worked examples for its
        declared supported domain. Most spec cases override the entry thresholds
        and income levels with synthetic parameter_assumptions (see the file
        header); the Task 26a.3 cases and the golden households run on the
        published values. No empirical estimate and no predictive record.
      cases:
        - {kind: spec_cases, path: policy_specs/accommodation_supplement/spec_cases.yaml, count: 26}
        - {kind: benchmarks, path: policy_specs/accommodation_supplement/benchmarks.yaml, count: 4}
        - {kind: golden_households, path: policy_specs/wff_as_interaction/golden_households.yaml, count: 9}
        - {kind: golden_snapshot, path: tests/fixtures/golden_results_v0_1.json, count: 9}
      tests:
        - tests/unit/engines/simulator/test_accommodation_supplement.py
        - tests/unit/engines/simulator/test_as_spec_cases.py
        - tests/unit/engines/simulator/test_as_benchmarks.py
        - tests/unit/engines/simulator/test_as_module.py
        - tests/unit/engines/simulator/test_as_rate_selectors.py
        - tests/regression/test_as_known_historical_issues.py
        - tests/regression/test_as_weekly_validation.py
        - tests/regression/test_golden_result_snapshot.py
      reviews:
        - reviews/2026-09-25-task34-3-codex.md
        - review_packets/as_task24_4.md
        - review_packets/task_26a_as_rate_audit.md
        - review_packets/review_queue.md
      open_items:
        - >-
          DEC-001 (income excess rounding) stays at medium confidence: no second
          published fractional-excess example was found.
    evidence_classes_consumed: [Rule, Scenario]
    evidence_note: >-
      Rule: approved parameters with a cited source, including published MSD
      table values at source rank 3 (policy_specs/accommodation_supplement/policy.yaml,
      DEC-002; epistemic-constitution decision 6). Scenario: the caller's
      asserted household facts. Its results are Model output. The class of each
      AS decision record (DEC-001 to DEC-003) is not yet stated; the constitution
      leaves existing records to a later change for Pete's confirmation.
    limitations:
      - text: Facts are asserted, not verified. A result is a conditional simulation, not an entitlement decision.
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: Housing not modelled, namely homeowners, social housing, joint tenancy, a community spouse or partner, accommodation income or business use of the home.
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: >-
          Claimant categories not modelled: NZ Superannuation, Veteran's Pension,
          mixed-benefit couples, the protected Jobseeker woman-alone rate, special
          care and residential rates.
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: >-
          Other-funding exclusions and any exempt cash asset are not modelled
          (the Student Allowance exclusion or exception included).
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: The Statistical Area Unit's Area 1-4 must be verified. It is never inferred or defaulted.
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: Parent rows need the eldest dependent child under 16 for the whole week. Changes within a week are not modelled.
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: Only weeks inside the reference period are covered. Another period is needs_review or has no rate for the date.
        source: docs/releases/V0_1_LIMITATIONS.md
    model_risks:
      - text: >-
          The income-excess rounding convention (DEC-001) is selected at medium
          confidence. Whole-dollar excesses give the same result either way.
        source: policy_specs/accommodation_supplement/decisions/DEC-001-income-excess-rounding.md
      - text: >-
          Entry thresholds and income levels rest on MSD's published tables
          (source rank 3), not on an Act or Order (DEC-002).
        source: policy_specs/accommodation_supplement/decisions/DEC-002-published-thresholds-and-rate-scope.md
      - text: >-
          The WFF income exclusion from AS chargeable income (DEC-003) is a
          selected interpretation of the law's text.
        source: policy_specs/accommodation_supplement/decisions/DEC-003-msd-paid-wff-income-exclusion.md
    change_log:
      - date: "2026-09-23"
        change: Task 23, the AS calculator, then Task 24.7 run_as_module() (commits 53a4084, 0186766).
        why: First implementation of the approved Task 22 scoped contract and its module entry point.
        evidence: policy_specs/accommodation_supplement/spec_cases.yaml
        validation_rerun: unknown (recorded before change records existed)
        approval: unknown (recorded before change records existed)
      - date: "2026-09-24"
        change: Task 26a.2/26a.3, the published AS thresholds and income levels added to policy.yaml (commit 2639676); policy version 0.1.1 (DEC-002).
        why: Replace synthetic entry thresholds with the published values.
        evidence: policy_specs/accommodation_supplement/decisions/DEC-002-published-thresholds-and-rate-scope.md
        validation_rerun: Task 26a.3 spec cases (policy_specs/accommodation_supplement/spec_cases.yaml)
        approval: unknown (recorded before change records existed)
      - date: "2026-09-26"
        change: r 15 "must not exceed" boundary, $0-cost exclusion (commit c5d4ea2).
        why: Findings from the v0.1 question-set review (Q71-Q140).
        evidence: review_packets/v0_1_question_set
        validation_rerun: unknown (recorded before change records existed)
        approval: unknown (recorded before change records existed)
      - date: "2026-10-05"
        change: Registered in the model registry (Task 1.5). No code change.
        why: BUILD_PLAN_PROGRAMME.md Task 1.5.
        evidence: model_registry/registry.yaml
        validation_rerun: pytest -q, including tests/unit/engines/assurance/test_model_registry.py
        approval: Pete, 5 October 2026 closeout instruction to accept the best options; reviews/2026-10-05-pr164.md

  - id: combined_runner
    name: Combined WFF and AS household runner
    kind: runner
    version: "0.1.0"
    version_basis: >-
      Package version in pyproject.toml. The runner has no version of its own.
      It runs WFF policy 0.1.0 and AS policy 0.1.1 as requested by the caller.
    owner: >-
      Pete (accountable model owner and decisions); Claude Code (implementation);
      GPT/Codex (sources, interpretation, independent review). Assigned under
      Pete's 5 October 2026 closeout authority; doctrine/model-governance.md.
    purpose: >-
      Runs one household through both module entry points, each for its own
      period, and compares the shared facts under the Task 28.3 interaction
      contract. There is no combined total and no income coupling. A shared-fact
      contradiction makes every component needs_review.
    entry_points:
      - {module: poltika.scenarios.combined, function: run_combined_household}
    depends_on: [wff_engine, as_engine]
    validation:
      level: spec_validated
      basis: >-
        Passes hand-calculated interaction cases and nine hand-calculated golden
        households, both re-derived by a fresh-context reviewer. Its least mature
        dependency is also spec_validated.
      cases:
        - {kind: interaction_spec_cases, path: policy_specs/wff_as_interaction/spec_cases.yaml, count: 5}
        - {kind: golden_households, path: policy_specs/wff_as_interaction/golden_households.yaml, count: 9}
        - {kind: golden_snapshot, path: tests/fixtures/golden_results_v0_1.json, count: 9}
      tests:
        - tests/unit/scenarios/test_combined.py
        - tests/unit/scenarios/test_interaction_spec_cases.py
        - tests/unit/scenarios/test_golden_households.py
        - tests/regression/test_wff_as_interaction_leaks.py
        - tests/regression/test_golden_result_snapshot.py
      reviews:
        - reviews/2026-09-25-task34-3-codex.md
        - review_packets/task_28_3_interaction_contract.md
        - review_packets/task_28_5_interaction_cases.md
        - review_packets/task_29_4_golden_households.md
      open_items: []
    evidence_classes_consumed: [Rule, Scenario, Model output]
    evidence_note: >-
      Rule and Scenario through the two engines. Model output: it consumes each
      engine's component results. Its own results are Model output.
    limitations:
      - text: Everything in the WFF and AS entries applies.
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: WFF is annual and AS is weekly. They are never added or converted, so there is no combined total.
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: There is no income coupling between the two policies (AS DEC-003).
        source: docs/releases/V0_1_LIMITATIONS.md
      - text: >-
          Only a small set of shared facts is compared. The policies' definitions
          differ, so a disagreement is escalated and never repaired.
        source: src/poltika/scenarios/combined.py
    model_risks:
      - text: >-
          The shared-fact comparison is deliberately conservative. A legitimate
          difference between the two policies' definitions can show as needs_review.
        source: src/poltika/scenarios/combined.py
    change_log:
      - date: "2026-09-24"
        change: Task 28.4, the combined runner, aligned with the revised Task 28.3 contract (commits 80b92c7, 7be8026).
        why: Implement the Task 28.3 interaction contract, with Pete's accepted decisions.
        evidence: policy_specs/wff_as_interaction/spec_cases.yaml
        validation_rerun: unknown (recorded before change records existed)
        approval: Pete accepted the Task 28.3 decisions (commit 98d3ef4 message)
      - date: "2026-09-25"
        change: Structured review reasons (commit f8b4b3a). No calculated amount changed (CHANGELOG.md).
        why: v0.1.5 structured needs_review reasons.
        evidence: docs/releases/V0_1_5_GATE.md
        validation_rerun: tests/acceptance/test_v0_1_5_release_gate.py (gate row "v0.1 results unchanged")
        approval: unknown (recorded before change records existed)
      - date: "2026-10-05"
        change: Registered in the model registry (Task 1.5). No code change.
        why: BUILD_PLAN_PROGRAMME.md Task 1.5.
        evidence: model_registry/registry.yaml
        validation_rerun: pytest -q, including tests/unit/engines/assurance/test_model_registry.py
        approval: Pete, 5 October 2026 closeout instruction to accept the best options; reviews/2026-10-05-pr164.md

  - id: population_runner
    name: Population runner (static microsimulation)
    kind: runner
    version: "0.1.0"
    version_basis: >-
      Package version in pyproject.toml. The runner has no version of its own.
      Each run has a run_id that hashes the population, the reform, the code
      identity and the policy files (src/poltika/scenarios/microsim/runner.py).
    owner: >-
      Pete (accountable model owner and decisions); Claude Code (implementation);
      GPT/Codex (sources, interpretation, independent review). Assigned under
      Pete's 5 October 2026 closeout authority; doctrine/model-governance.md.
    purpose: >-
      Runs every household of a population twice through the combined runner,
      under the approved parameters and under a reform's copy, and keeps each
      component's outcome and delta. There is no other calculation path. Today's
      population is the synthetic development population.
    entry_points:
      - {module: poltika.scenarios.microsim.runner, function: run_population}
    depends_on: [combined_runner]
    validation:
      level: spec_validated
      basis: >-
        The runner's arithmetic passes hand-calculated population cases (the
        author's, and GPT/Codex's fixed cases). That validates the mechanics on
        small populations only. The population is synthetic, and the
        cross-validation against published figures shows scope gaps, none tuned
        away. There is no empirical validation of a population result.
      cases:
        - {kind: hand_calculated_population_cases, path: tests/acceptance/test_v0_2_hand_calculated.py, count: unknown}
        - {kind: independent_population_cases, path: tests/acceptance/test_v0_2_independent_population_cases.py, count: unknown}
        - {kind: cross_validation_report, path: docs/releases/V0_2_CROSS_VALIDATION.md, count: unknown}
        - {kind: golden_snapshot, path: tests/fixtures/golden_results_v0_1.json, count: 9}
      tests:
        - tests/unit/scenarios/microsim/test_runner.py
        - tests/unit/scenarios/microsim/test_analysis.py
        - tests/unit/scenarios/microsim/test_weighting.py
        - tests/unit/scenarios/microsim/test_crossval.py
        - tests/acceptance/test_v0_2_release_gate.py
      reviews:
        - reviews/2026-09-27-pr117.md
        - reviews/2026-09-27-v0-2-fresh-same-model-check.md
        - review_packets/review_queue.md
      open_items:
        - >-
          No empirical national-population validation is claimed. The review
          queue records #111, #113 and #114 cleared on Pete's 27 September
          confirmation; V0_2_LIMITATIONS.md's historical pending-review text
          predates that clearance.
    evidence_classes_consumed: [Rule, Scenario, Assumption, Fact, Estimate, Model output]
    evidence_note: >-
      Rule and Scenario through the combined runner. Reform overrides marked
      scenario_assumption are Scenario. The population's listed assumptions are
      Assumption. The published shares the generator draws on are Fact or
      Estimate by dataset (epistemic-constitution decisions 2 and 4). The
      household records are a Scenario, always labelled synthetic. Results are
      Model output.
    limitations:
      - text: Every result is for the synthetic development population, not an estimate for New Zealand.
        source: docs/releases/V0_2_LIMITATIONS.md
      - text: >-
          Household type, income, tenure, housing cost, region and area are
          drawn independently, so real correlations are lost. Income is two
          coarse uniform bands.
        source: docs/releases/V0_2_LIMITATIONS.md
      - text: Everyone is an in-work non-beneficiary (assumption A6). No beneficiary or main-benefit interaction is exercised.
        source: docs/releases/V0_2_LIMITATIONS.md
      - text: Four household types only. The population represents 1.45 million households, not 2.03 million.
        source: docs/releases/V0_2_LIMITATIONS.md
      - text: Static and full take-up. No behavioural response, take-up rate or timing.
        source: docs/releases/V0_2_LIMITATIONS.md
      - text: The 2026-27 in-work tax credit and minimum family tax credit are needs_review for every household, so there is no WFF total.
        source: docs/releases/V0_2_LIMITATIONS.md
      - text: No annual Accommodation Supplement figure and no combined effective marginal tax rate.
        source: docs/releases/V0_2_LIMITATIONS.md
      - text: Deciles rank by gross household income, not equivalised income.
        source: docs/releases/V0_2_LIMITATIONS.md
    model_risks:
      - text: >-
          Cross-validation reaches about three-quarters of published family tax
          credit families, a fifth of AS recipients and an eighth of Best Start
          families. A reader could take the modelled figure for a national estimate.
        source: docs/releases/V0_2_CROSS_VALIDATION.md
      - text: Family tax credit cost is sensitive to where families sit relative to the abatement threshold, and so to the coarse income bands.
        source: docs/releases/V0_2_LIMITATIONS.md
    change_log:
      - date: "2026-09-26"
        change: v0.2 Phase 7, the population runner, run identity and spec cache (commit b52e909).
        why: BUILD_PLAN_v0_2.md static microsimulation.
        evidence: tests/unit/scenarios/microsim/test_runner.py
        validation_rerun: unknown (recorded before change records existed)
        approval: unknown (recorded before change records existed)
      - date: "2026-09-26"
        change: Task 9.1, verified population explanations (commit e6bda2d).
        why: BUILD_PLAN_v0_2.md Task 9.1.
        evidence: tests/unit/scenarios/microsim/test_explain.py
        validation_rerun: unknown (recorded before change records existed)
        approval: unknown (recorded before change records existed)
      - date: "2026-10-05"
        change: Registered in the model registry (Task 1.5). No code change.
        why: BUILD_PLAN_PROGRAMME.md Task 1.5.
        evidence: model_registry/registry.yaml
        validation_rerun: pytest -q, including tests/unit/engines/assurance/test_model_registry.py
        approval: Pete, 5 October 2026 closeout instruction to accept the best options; reviews/2026-10-05-pr164.md

# Public run_* and calculate_* functions the discovery test finds that are not
# a model's entry point. Each is a wrapper over a registered model. A new one
# must be registered above or listed here with a reason.
not_engines:
  - module: poltika.scenarios.record
    function: run_scenario
    reason: Runs one ScenarioRecord through run_combined_household and adds run identity. No second calculation path.
    wraps: combined_runner
  - module: poltika.scenarios.microsim.worked_examples
    function: run_examples
    reason: Runs named households under a reform through run_combined_household, using the population runner's delta rules. No second calculation path.
    wraps: population_runner

# Subpackages of poltika.engines that hold no model.
not_model_packages:
  - package: poltika.engines.assurance
    reason: Provenance, explanation, evidence and currency reports built from recorded results. They calculate no policy outcome.
