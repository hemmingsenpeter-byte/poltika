# v0.1.5 Task 8.1: a pilot deployment -- the API and PostgreSQL.
#   docker compose up --build
# then open http://localhost:8000/analyst (API docs at /docs).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: poltika
      POSTGRES_PASSWORD: poltika
      POSTGRES_DB: poltika
    volumes:
      - poltika-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poltika"]
      interval: 2s
      retries: 30

  api:
    build: .
    environment:
      POLTIKA_DATABASE_URL: postgresql+psycopg://poltika:poltika@db/poltika
    volumes:
      # The reviewed policy files this deployment serves (read-only).
      - ./policy_specs:/policy_specs:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  poltika-db:
