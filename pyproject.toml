[project]
name = "poltika"
version = "0.1.0"
description = "Deterministic NZ policy simulation — v0.1 foundation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    # Task 32 (ADR-0013): scenario/run storage in PostgreSQL.
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
# v0.1.5 Task 8.1: what the pilot container needs to serve the API.
serve = [
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# installed_artifact tests build a wheel and install it into a throwaway
# venv (ADR-0011) -- too slow for the default fast suite, excluded here
# and run explicitly with `uv run pytest -m installed_artifact`.
markers = [
    "installed_artifact: builds and installs a real wheel (slow, not part of the default suite)",
    "postgres: needs local PostgreSQL server binaries (initdb/pg_ctl); skipped when absent",
    "code_replay: replays a stored run on its retained code revision in a git worktree (slow, opt-in)",
]
addopts = "-m 'not installed_artifact and not code_replay'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
packages = ["poltika"]
strict = true
