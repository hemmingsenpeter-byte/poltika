- id: jobseeker-support-social-security-act-20260926
  kind: legislation
  title: Social Security Act 2018 — current dated Jobseeker first-slice provisions
  url: https://www.legislation.govt.nz/act/public/2018/32/en/2026-09-26/
  version_as_at: '2026-09-26'
  version_label: Official latest index on 13 October; PDF version 297_0.
  checked_on: 2026-10-13
  locator: ss 8, 16-28, 349-351; Schedule 2 dependent child and Income Test 3(b); Schedule 3 cls 2-14; Schedule 4 Part 1 cls 1(a)-(d), 2, 7.
  finding: >-
    Ordinary single 25+ without dependent children uses cl 1(d) only when the legacy 2013-transfer
    cl 1(c) category does not apply. Statutory rate is 372.55 weekly subject to Test 3 (70 cents per
    dollar above 160 weekly). Section 24(2) distinguishes temporary nil payment from lost entitlement;
    s 18 is per person in their own right. Schedule 3 income is before tax with inclusions/exclusions
    and allocation rules. Sections 349-351 establish a tax-dependent benefit gross-up relationship.
  version_comparison: Full extracted text against 4 September showed the substantive change in Schedule 2 CYPFA order or agreement para (a), adding Oranga Tamariki Act s 283(na); the scoped JS monetary provisions were unchanged.
  amendment_locator: Schedule 2 CYPFA order or agreement para (a), amended 26 September 2026 by Oranga Tamariki (Responding to Serious Youth Offending) Amendment Act 2026 (2026 No 65) s 60.
  limitation: >-
    Scoped check only, not a whole-Act eligibility audit. The 372.55 rate is the statutory rate matching
    MSD net M, not gross 426.12. Complete income preparation, final/intermediate precision, nil-payment
    boundary and arbitrary-income gross conversion remain gated. No post-2 November coverage
    or full-year assurance is claimed; the selected completed week awaits independent review.
  review_state: Author observation and draft interpretation pending independent review and Pete's decision gates.
