- id: jobseeker-support-msd-income
  kind: agency_guidance
  title: MSD MAP — Jobseeker Support income charging
  url: https://map.workandincome.govt.nz/map/income-support/main-benefits/jobseeker-support/changes-and-reviews-jobseeker-support/income-test-01.html
  checked_on: '2026-10-03'
  locator: Income test; family categories; Weekly charging of income for Jobseeker Support Clients; Legislation.
  finding: >-
    Family categories have different income-test treatment. MAP describes the
    prior annual-charging transition as ended. The legal boundary is per grant:
    Regulations Schedule 1 cl 25(4) ends the transition at the end of the
    52 weeks specified in cl 25(1)(b). Historical grants require that dated
    statutory check; current ordinary JS charging uses r 205/Schedule 6.
  limitation: Live guidance has no published version date on the retrieved page. Use the dated Act and
    regulations for legal timing; amounts are not adopted.
