- id: jobseeker-support-ird-det-24-03
  kind: agency_interpretation
  legal_character: Commissioner determination exercising ITA RD 11(3); current catalogue kind retained conservatively without a schema change.
  title: IRD DET 24/03 — amount of tax for a payment of a main benefit
  url: https://www.taxtechnical.ird.govt.nz/-/media/project/ir/tt/pdfs/determinations/miscellaneous/2024/det-24-03.pdf?modified=20240715225311
  issued_on: '2024-07-10'
  effective_period_label: 2024-25 income year onwards; operative payment-date split at 2 August 2024.
  checked_on: '2026-10-15'
  locator: >-
    Operative Determination, printed p 1 (PDF page 2); background paras 1-3, 5.2, 6,
    printed pp 2-3 (PDF pages 3-4); background is expressly outside the determination.
  finding: >-
    Under ITA RD 11(3), after consultation with the MSD chief executive, the
    Commissioner selects the M tax-code rate in weekly PAYE tables applying from
    31 July 2024 for main-benefit payments made from 2 August 2024. Background
    distinguishes that payment tax from final annual tax on total taxable income.
  limitation: >-
    Locates the previously missing determination. Complete computational application,
    continuing currency, precise IR340 edition, payment-date relation to entitlement,
    fractional-income handling and rounding still require source review. SSA s 350(3)
    already establishes the inverse gross-up relationship; the ACC Act source below
    supports exclusion of main benefits from employee earnings for levy purposes.
    The exact benefit-tax calculation/precision remains unverified. No complete
    gross benchmark or approved value is supplied.
  review_state: Documentary authority candidate; no promotion or protected expected-value approval.
- id: jobseeker-support-ird-ir340-table-candidates
  kind: agency_guidance
  title: IRD IR340 — weekly PAYE tables, table-edition and levy check candidates
  url: https://www.ird.govt.nz/deductions
  page_updated_on: '2026-04-01'
  checked_on: '2026-10-15'
  locator: Current Apr 2026 IR340 and Previous years Aug 2024 IR340 links; current PDF printed p 3.
  current_table_url: https://www.ird.govt.nz/-/media/project/ir/home/documents/forms-and-guides/ir300---ir399/ir340/ir340-apr-2026.pdf?modified=20260323203256
  determination_referenced_edition_url: https://www.ird.govt.nz/-/media/project/ir/home/documents/forms-and-guides/ir300---ir399/ir340/ir340-aug-2024.pdf?modified=20250314001644
  finding: >-
    The current edition states 1 April 2026 to 31 March 2027; the August 2024
    cover states 31 July 2024 to 31 March 2025. Current salary/wage tables include
    ACC earners levy. DET 24/03 is benefit-tax authority, not automatic authority
    to copy the whole employee deduction or substitute annual salary tax.
  limitation: >-
    Table edition and benefit-specific calculation/rounding use remain for review.
    Main-benefit levy exclusion is supported by the ACC Act source below; it does
    not establish a method for removing levy from a rounded employee-table amount.
    No ordinary-wage calculator or tax table result is used as a benefit benchmark.
  review_state: Located for bounded follow-up; gross method and precision remain needs_review.
- id: jobseeker-support-acc-act-main-benefit-levy-exclusion
  kind: legislation
  title: Accident Compensation Act 2001 — main-benefit exclusion from employee earnings
  url: https://www.legislation.govt.nz/act/public/2001/49/en/2026-07-10/
  version_as_at: '2026-07-10'
  checked_on: '2026-10-15'
  locator: ss 9(1)-(2), 11(1)(a), 11(2), 219(1),(3), 220(1), 221(1)(a).
  finding: >-
    Section 11(1)(a) excludes main benefits from earnings as an employee;
    s 11(2) adopts the ITA YA 1 meaning. Sections 219-221 establish the
    earners-levy and employee-deduction context. This narrows the levy question:
    the full salary/wage M deduction, which includes ACC, is not directly the
    main-benefit income-tax amount.
  retrieval_method: Official dated HTML and latest index fetched directly with a browser user agent after web-reader failure; latest index also identifies 10 July 2026.
  retrieved_html_sha256: 5586132230814b404d600eebadb95a0e0af12512a6722dc01b2c4fec4dfdf527
  limitation: >-
    Does not supply benefit-specific tax-table selection, fractional preparation,
    inverse-solution precision, cent/tie rules or an algorithm for subtracting
    levy from a rounded employee deduction. No full-period currency audit,
    gross expected amount or numerical source approval is claimed.
  review_state: Author statutory source check; candidate pending independent Claude review and applicable Pete gates.
