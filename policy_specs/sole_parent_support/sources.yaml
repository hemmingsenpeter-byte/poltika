- id: sole-parent-support-social-security-act-2026-09-26
  kind: legislation
  title: Social Security Act 2018 — 26 September 2026 consolidation
  url: https://www.legislation.govt.nz/act/public/2018/32/en/2026-09-26/
  version_as_at: '2026-09-26'
  checked_on: 2026-10-13
  locator: >-
    ss 8, 16-19, 29-33, 349-351; Schedule 2 child, dependent child,
    principal caregiver and Income Test 1; Schedule 3 cls 2-9, 11-15,
    Parts 3A and 4; Schedule 4 Part 2 cls 1-4.
  finding: >-
    SPS s 29 requires the sole-parent, care, residence and age conditions;
    s 30(a) is the ordinary single route, while ss 31-32 require distinct
    child/care handling. Section 33 expires SPS when the youngest dependent
    child turns 14. Schedule 4 Part 2 uses 521.52 subject to Income Test 1,
    permits discretionary childcare disregard and spouse-income attribution,
    and excludes OB/UCB children for that rate part. Section 18 is per person.
    Sections 349-351 identify a separate tax-payment/gross-up mechanism.
  comparison_with_previous_version:
    source_id: sole-parent-support-social-security-act
    previous_version_as_at: '2026-09-04'
    checked_on: 2026-10-13
    finding: >-
      The scoped SPS ss 29-33, Schedule 4 Part 2, Schedule 3 cl 13,
      Income Test 1, s 18 and tax provisions are unchanged. The later
      consolidation adds Oranga Tamariki Act s 283(na) to Schedule 2's
      CYPFA order or agreement definition via 2026 No 65 s 60;
      exceptional child-order routes remain outside this first slice.
  limitation: >-
    Scoped reading only, not a whole-Act eligibility or payment audit.
    Numeric gross output and precision remain blocked; no historical or
    post-2-November coverage is established.
