sources:
- id: sole-parent-support-social-security-act
  kind: legislation
  title: Social Security Act 2018
  url: https://www.legislation.govt.nz/act/public/2018/32/en/2026-09-04/
  version_as_at: '2026-09-04'
  locator: ss 29-33; Schedule 4 Part 2 cls 1-4; Schedule 2 Income Test 1. Also ss 8, 16-19; Schedule 2
    definitions; Schedule 3 Parts 1-3A.
  finding: Person, partner and policy-specific child status select the applicable grant and income test.
    Income definitions have express inclusions, exclusions and ordering; statutory main benefits and WFF
    credits are excluded by Schedule 3 cl 8(1)(a), (l).
  limitation: Scoped provisions only. No whole-Act, application-history, sanctions, absence, stand-down
    or historical-year audit; no numerical parameter adoption.
  checked_on: '2026-10-03'
- id: sole-parent-support-social-security-regulations
  kind: regulations
  title: Social Security Regulations 2018
  url: https://www.legislation.govt.nz/secondary-legislation/pco-drafted/2018/202/en/2026-09-04/
  version_as_at: '2026-09-04'
  locator: r 205 and Schedule 6; rr 17-18 for the AS interaction.
  finding: Regulation 205 and Schedule 6 distinguish income assessment bases; beneficiary class also
    affects Accommodation Supplement under regulations 17-18.
  limitation: Income exemptions in Schedule 8 and exceptional administration routes are not exhaustively
    scoped; guidance does not approve selection of an assessment basis.
  checked_on: '2026-10-03'
  specification_check:
    checked_on: 2026-10-13
    version_as_at: '2026-09-04'
    locator: r 205(1)-(3); Schedule 6 item 1; Schedule 8 exemption routes remain outside the income-classification implementation.
    finding: >-
      SPS income is normally determined over 52 weeks. MSD may determine income
      over one week with the person's agreement; either party may end that
      agreement by notice at any time. The draft requires an agreement active
      throughout its exact week and receives already classified weekly income.
    limitation: >-
      No conversion from annual amounts or raw income periods is approved.
      Exemptions are not exhaustively specified and cannot be chosen by Poltika.
- id: sole-parent-support-rates-order-2026
  kind: regulations
  title: Social Security (Rates of Benefits and Allowances) Order 2026
  url: https://www.legislation.govt.nz/secondary-legislation/pco-drafted/2026/36/en/2026-03-02B/
  version_as_at: '2026-03-02'
  version_label: As made; dated URL has B suffix.
  legal_commencement: '2026-04-01'
  locator: cls 2-5; Schedule 1 Part 1, Schedule 4 Part 2 entries.
  finding: Clause 2 establishes commencement; cl 4 applies the adjustments to benefits payable on and
    after commencement. Clause 5 and Schedule 1 amend the three benefit rate tables.
  limitation: Rates were located, not transcribed. No approved values, end date, gross/net conversion
    or rounding method is established by this source-only inventory.
  checked_on: '2026-10-03'
  specification_check:
    checked_on: 2026-10-13
    locator: cls 2-5; Schedule 1 Part 1, Schedule 4 Part 2 cl 1 row.
    finding: >-
      The Order replaces 505.80 with 521.52 in the SPS statutory table from
      1 April 2026. It does not replace the table with the agency gross amount
      606.69 or supply a gross-up method for abated amounts.
    limitation: >-
      Documentary candidates only. Gross entitlement and precision remain
      gated by DEC-001 and DEC-002; no parameter end date is invented.
- id: sole-parent-support-income-tax-act-interactions
  kind: legislation
  title: Income Tax Act 2007 — main-benefit interactions
  url: https://www.legislation.govt.nz/act/public/2007/97/en/2026-09-04/
  version_as_at: '2026-09-04'
  locator: CF 1(1)(c); YA 1 main benefit; MB 1(1)(b), MB 2; MC 6(b)(i), MD 8, MD 14, ME 2, MG 4.
  finding: These main benefits are taxable income; WFF allocates main-benefit income over the paid-for
    period. Receipt has component-specific WFF eligibility and protected-month consequences; employment
    remains a separate test.
  limitation: Interaction locators only. No PAYE calculation, full-year policy coverage, MFTC result,
    protected-credit calculation or new disposable-income definition is approved.
  checked_on: '2026-10-03'
  specification_check:
    checked_on: 2026-10-13
    version_as_at: '2026-09-04'
    locator: RD 11(3)(a); CF 1(1)(c). Earlier WFF locators remain source-scope history only.
    retrieval_note: >-
      Read the official full HTML cache whose header states Version as at
      4 September 2026; independent scoped reading, not an external engine.
    finding: >-
      RD 11(3) overrides RD 10(1) for main-benefit PAYE payments: the amount
      of tax must be determined by the Commissioner in consultation with the
      administering department's chief executive. CF 1(1)(c) identifies the
      taxable main-benefit class.
    limitation: >-
      The operative Commissioner/MSD determination and its precision have
      not been verified. No ordinary wage table or annual income-tax assumption
      substitutes for it; no new WFF interaction is accepted.
