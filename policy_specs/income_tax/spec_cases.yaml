implementation_regression_handoff:
  # Server-owned states, not facts callers can assert to bypass review.
  - Unknown authority and a known-zero amount must remain needs_review without a value.
  - Candidate parameter values must never produce calculated merely because arithmetic is available.
  - Refuse requests outside [2026-04-01,2027-04-01) and mismatched policy identity/version.
  - Reject malformed/non-finite/binary-float numeric transport at request validation.
  - Require complete applicable candidate intervals; missing/overlapping rates never become zero/current defaults.
  - Trace individual, year, assertions, parameter intervals/review status, sources, Q16-Q18 and DEC004.
  - PAYE, ACC, credit, terminal-tax and household-conversion requests are separate unsupported components, never basic_tax aliases.
