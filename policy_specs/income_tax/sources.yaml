  from: 2026-04-01
  to: 2027-04-01
  status: proposal_not_approved
annual_rates_status:
  reference_tax_year: 2026-27
  status: needs_review
  reason: >-
    BB 1 requires an annual taxing Act. The retrieved 2026-27 instrument
    is Bill 344-1, not an enacted annual rates Act. Current Schedule 1
    and an IRD operational table do not clear that statutory gate.
  recheck: >-
    Locate enacted 2026-27 annual rates legislation and its application
    provision, recheck relevant amendments for the approved period,
    and obtain independent review before approving parameters.
retrieval_note: >-
  Checked 3 October 2026 Pacific/Auckland. NZ Legislation HTML was
  retrieved directly using curl with a browser user agent after the web
  reader returned 403 or an access error. Modern /en/<version>/ routes
  worked; legacy whole.html did not. Only the provisions listed below
  were reviewed. Agency HTML is a dated observation, not an immutable
  historical snapshot. No raw statistical dataset was acquired.
sources:
  - id: it-income-tax-act-core
    kind: legislation
    title: Income Tax Act 2007 - personal income-tax scope and annual basis
    url: https://www.legislation.govt.nz/act/public/2007/97/en/2026-09-04/
    source_version: 2026-09-04
    retrieved_on: 2026-10-03
    locator: >-
      BB 1; BC 1-8; CE 1(1)(a); CF 1(1)(c); CW 33(1)(a);
      DA 2(4), (7); LC 13(1)-(6); MA 3; RD 3(1);
      YA 1 definition of main benefit; YD 1; YE 1(1)-(5).
    covers: >-
      Annual-taxing-Act requirement; taxable income versus gross income;
      basic liability versus credits and terminal tax; ordinary salary
      and wages; main benefits and exempt benefit categories; distinct
      PAYE rules; residency and tax-year scope; IETC as a separate credit.
    verification_status: listed_provisions_author_checked_independent_review_pending
    scope_check:
      finding: >-
        BC 2-5 distinguish assessable income, deductions, losses and
        taxable income. BC 6 and Schedule 1 determine basic tax; BC 8
        separately deals with credits and terminal tax. CE 1 includes
        salary and wages. CF 1 includes main-benefit payments, while
        CW 33 exempts specified other monetary benefits. LC 13 has
        separate eligibility and whole-month rules. YE 1 identifies
        the April-March tax year and distinguishes non-standard years.
      limitation: >-
        Not a complete income-classification, timing, deduction, tax-credit,
        residency or filing-status specification. No final assessment,
        rounding convention or graph edge is approved by this inventory.
  - id: it-income-tax-act-basic-rates
    kind: legislation
    title: Income Tax Act 2007 - basic income-tax rates
    url: https://www.legislation.govt.nz/act/public/2007/97/en/2026-09-04/
    source_version: 2026-09-04
    retrieved_on: 2026-10-03
    locator: Schedule 1 Part A clause 1 and Table 1; cross-reference BB 1 and BC 6.
    covers: General basic-rate table, subject to the annual taxing Act and special-rate exclusions.
    verification_status: listed_provisions_author_checked_independent_review_pending
    scope_check:
      finding: >-
        Clause 1 uses Table 1 for each dollar of taxable income and applies
        only to persons without a basic rate under clauses 2-14. Its
        history note identifies the 2024 Budget Measures Act amendment.
      limitation: >-
        No rates are copied into runtime parameters or expected-value
        fixtures here. The 2026-27 annual-rates gate remains unresolved;
        fractional-dollar treatment and rounding need separate research.
