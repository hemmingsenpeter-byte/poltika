  - id: it-social-security-act-main-benefit
    kind: legislation
    title: Social Security Act 2018 - main-benefit definition
    url: https://www.legislation.govt.nz/act/public/2018/32/en/2026-09-04/
    source_version: 2026-09-04
    retrieved_on: 2026-10-03
    locator: >-
      Schedule 2 definition of main benefit, paragraph (a)(i)-(vii);
      Income Tax Act 2007 YA 1 main benefit, paragraphs (a)-(b), and
      main benefit equivalent assistance.
    covers: Complete main-benefit definition relevant to the Income Tax Act YA 1 cross-reference, with the proposed supported subset kept separate.
    verification_status: schedule_2_definition_author_checked_independent_review_pending
    scope_check:
      finding: >-
        The general definition includes Jobseeker Support, Sole Parent
        Support, both specified Supported Living Payment grounds, youth
        payment, young parent payment and emergency benefit. YA 1 also
        includes main benefit equivalent assistance. The last four
        categories are unsupported in the proposed first slice, rather
        than absent or treated as zero. Section 326 has its own
        context-specific definition and is not substituted for Schedule 2.
      limitation: >-
        No benefit eligibility, gross-up, rate, net-to-gross reconstruction,
        partner allocation, or weekly-to-annual conversion is established here.
