# Income tax golden households (v0.3 Phase 2.5; new-policy PR 3 "golden households").
#
# NON-NUMERIC by design. Every income-tax value is draft (policy.yaml status
# draft_pending_review, policy_version null, every parameter needs_review), so
# no result here is `calculated` and no expectation holds an amount, a tax
# figure or a bracket value. Each household runs through the shared household
# model (`run_household_income_tax`, one call per person: IT-01 assesses one
# natural person, so a partner's income and facts are never read).
#
# Expectations are outcome, reason code, category, missing facts and policy
# identity only. The outcomes and their precedence were derived by Claude Code
# from the specification's "Input and outcome contract" and calculation
# sequence (`unsupported` outranks `needs_review`; a missing fact is never
# zero; IT-01 to IT-05, Q10, Q17). The HOUSEHOLD_* reason codes (g06 to g09)
# and the draft policy-identity string are not in the specification: they are
# the household mapping's own codes, named from the code
# (`household_mappings.py`, `income_tax.py` `_unloaded_trace`; ADR-0017, D50).
# They are AI hypotheses until the independent review row clears
# (review_packets/review_queue.md). The statutory-value guard watches this
# file (ADR-0007).
#
# Spell amounts are synthetic, caller-asserted inputs (whole-dollar except g44, which is fractional on purpose). They are
# not statutory values and none is within 2 of a candidate parameter (the runner
# checks each amount is on a fixed allow-list and at least 2 from every number in policy.yaml,
# except the -1 negative-income sentinel). A draft policy ignores
# them.
#
# Not written here, waiting on the protected-value process
# (doctrine/test-doctrine.md): see `waiting_on_protected_value_process`.
status: draft_not_reviewed
policy:
  policy_id: income_tax
  component_id: basic_annual_income_tax
  policy_version: none (draft_pending_review)
  tax_year: {start: 2026-04-01, end: 2027-04-01}

in_slice_facts: &in_slice
  individual_status: verified
  residence_scope: whole_year_ordinary_nz_resident
  tax_year_basis: standard_2026_27
  income_composition: ordinary_salary_wages_only
  no_deductions_status: verified
  no_available_losses_status: verified
  general_basic_rate_status: verified
  taxable_income_basis_attestation: true

waiting_on_protected_value_process:
  - id: w1_each_bracket_boundary
    covers: "each bracket threshold in the basic-rate table (cl 1/Table 1), at the threshold and one dollar either side"
    waiting_on: "Pete's approval of the candidate parameter values and the Royal-assent source gate (Q16); policy.yaml is draft_pending_review"
  - id: w2_known_zero_income
    covers: "known zero taxable income and the first dollar above it"
    waiting_on: "approved policy values and DEC-004 output precision"
  - id: w3_calculated_result_per_earner
    covers: "a calculated result for a single earner and for each of two earners"
    waiting_on: "approved policy values, DEC-004 output precision and the official benchmark (benchmarks.yaml benchmark_status missing_source)"
  - id: w4_rounding_of_a_calculated_amount
    covers: "any displayed rounding of a calculated amount"
    waiting_on: "DEC-004 (final output precision is MISSING_SOURCE)"

households:
  - id: g01_single_earner
    why: "IT-01 to IT-05 all verified and one whole-year taxable-income spell: the only gate left is the draft policy, so needs_review with no amount."
    household:
      household_id: g01-single-earner
      persons:
        - person_id: a
          role: claimant
          income_tax_facts: *in_slice
      families:
        - {claimant_id: a, partner_status: single}
      income_spells:
        - {person_id: a, income_type: unsplit_total, start: 2026-04-01, end: 2027-04-01, amount: '52000', basis: it_annual_taxable}
    runs:
      - {person: a, outcome: needs_review, code: IT_POLICY_NOT_APPROVED, category: null, missing_facts: []}
  - id: g02_two_earners_each_mapped_alone
    why: "IT-01: each person maps on their own facts and spell; both are in the slice and both stop at the draft policy. Neither reads the other's income."
    household:
      household_id: g02-two-earners-each-mapped-alone
      persons:
        - person_id: a
          role: claimant
          income_tax_facts: *in_slice
        - person_id: b
          role: partner
          income_tax_facts: *in_slice
      families:
        - {claimant_id: a, partner_status: partnered, partner_id: b}
      income_spells:
        - {person_id: a, income_type: unsplit_total, start: 2026-04-01, end: 2027-04-01, amount: '52000', basis: it_annual_taxable}
        - {person_id: b, income_type: unsplit_total, start: 2026-04-01, end: 2027-04-01, amount: '38000', basis: it_annual_taxable}
    runs:
      - {person: a, outcome: needs_review, code: IT_POLICY_NOT_APPROVED, category: null, missing_facts: []}
      - {person: b, outcome: needs_review, code: IT_POLICY_NOT_APPROVED, category: null, missing_facts: []}
  - id: g03_one_earner_and_a_non_earner_partner
    why: "The partner asserted no facts and has no spell: every fact is unknown (never the claimant's, never zero), and annual taxable income is missing."
    household:
      household_id: g03-one-earner-and-a-non-earner-partner
      persons:
        - person_id: a
          role: claimant
          income_tax_facts: *in_slice
        - person_id: b
          role: partner
      families:
        - {claimant_id: a, partner_status: partnered, partner_id: b}
      income_spells:
        - {person_id: a, income_type: unsplit_total, start: 2026-04-01, end: 2027-04-01, amount: '52000', basis: it_annual_taxable}
    runs:
      - {person: a, outcome: needs_review, code: IT_POLICY_NOT_APPROVED, category: null, missing_facts: []}
      - {person: b, outcome: needs_review, code: IT_FACTS_UNVERIFIED, category: null, missing_facts: [individual_status, residence_scope, tax_year_basis, income_composition, no_deductions_status, no_available_losses_status, general_basic_rate_status, taxable_income_basis_attestation, annual_taxable_income]}
  - id: g04_unknown_income
    why: "All facts verified but no taxable-income spell: income is unknown, never zero."
    household:
      household_id: g04-unknown-income
      persons:
        - person_id: a
          role: claimant
          income_tax_facts: *in_slice
      families:
        - {claimant_id: a, partner_status: single}
    runs:
      - {person: a, outcome: needs_review, code: IT_FACTS_UNVERIFIED, category: null, missing_facts: [annual_taxable_income]}
