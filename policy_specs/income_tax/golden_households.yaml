    runs:
      - {person: a, outcome: needs_review, code: IT_POLICY_NOT_APPROVED, category: null, missing_facts: []}
      - {person: b, outcome: needs_review, code: HOUSEHOLD_SPELL_PERIOD_MISMATCH, category: null, missing_facts: []}
  - id: g10_exclusion_outranks_a_mapping_refusal
