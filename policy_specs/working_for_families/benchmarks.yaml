      Azra's actual cohort; it is deliberately not asserted here because
      it is genuinely outside what this branch calculates -- the case
      demonstrates `unsupported`, not a false zero, for a real published
      later-cohort child, the same failure mode Task 12's second PR #14
      review finding fixed against a self-authored scenario. This is also
      the only Best Start worked example IRD publishes; no in-scope
      numeric Best Start benchmark exists in current IRD guidance.
