# Task 14: benchmark tests against independently published IRD worked
# examples, per doctrine/test-doctrine.md's "Benchmark tests for expected
# statutory values" class and BUILD_PLAN.md's "checked against
# independently published IRD/MSD/Treasury worked examples. This is what
# prevents AI-on-AI validation from being the only check." This file is one
# of .github/workflows/statutory-value-guard.yml's protected paths.
#
# Every numeric `expected` value below is copied verbatim from the cited
# IRD page's own stated worked-example result (not derived by Claude Code),
# with the exact wording quoted in `source_note` for traceability. This is
# the opposite discipline from spec_cases.yaml (Task 13), where every value
# was hand-derived independently from specification.md -- here, the whole
# point is a THIRD PARTY's number, fetched directly from ird.govt.nz (via a
# browser-user-agent request, since a bare fetch 403'd -- the same access
# pattern already used elsewhere in this repo) on 2026-09-22.
#
# `benchmarked_components` names which component(s) each case is actually
# checking a published number against. The other components in `expected`
# are not benchmarked against a published figure, but every case still
# asserts all four -- consistent with the completeness discipline PR #15's
# review established for spec_cases.yaml -- recording whatever
# calculate_wff() honestly produces given exactly the facts that specific
# IRD example actually states, with everything the example doesn't cover
# left genuinely unverified (None/UNKNOWN), never fabricated to make a
# number line up.
#
# All four IRD pages this file draws from explicitly confirm 2026-27 rates
# ($7,921/$6,454/$44,900/27.5% family tax credit; $7,670/$780 in-work;
# $36,604/$703 minimum family; $4,041/$79,000/21% Best Start, and the Best
# Start page states outright: "In the examples we use the rates for the
# 2026-2027 tax year"). specification.md's own reviewed rates match these
# exactly -- an independent cross-check in itself. Every example's stated
# result is explicitly an ANNUAL figure (IRD labels each one "(for the
# year)"/"full-year entitlement"), never a weekly/fortnightly instalment
# treated as if it were the annual amount -- the specific trap
# specification.md warns against.
#
# All cases run against a synthetic fixture carrying the same statutory
# rates as the real approved policy.yaml (policy_version 0.1.0), but with
# every parameter -- including in_work_base -- marked approved, exactly
# the same design test_wff.py (Task 12) already established and documents:
# in_work_base's live needs_review rate-status gate is a separate, already
# protected concern (spec_cases.yaml, Task 13), and using it here would
# mask whether a genuine arithmetic or scope-boundary bug exists behind
# that unrelated gate. Two of these cases (Brooklyn's direct-abatement
# exclusion, Faraj's birth-cohort exclusion) specifically need that
# separation to prove the exclusion is a real scenario-level fact, not an
# artifact of the live rate gate.
#
# Two IRD-published examples were deliberately NOT promoted as in-scope
# numeric benchmarks, each for a reason discovered by checking the
# specification.md text directly rather than assumed by analogy:
#   - Casey's minimum family tax credit example (self-employed income plus
#     a qualifying salaried job) was initially assumed out of scope by
#     loose analogy with the in-work tax credit page's explicit
#     self-employment exclusion -- re-reading specification.md's minimum
#     family tax credit domain paragraph directly shows no such exclusion
#     exists for that component (only in-work tax credit's domain excludes
#     self-employment), so Casey's example is promoted as in-scope after
#     all.
#   - Rahui's and Claire & Laura's family tax credit examples give only a
#     combined partnered family income ($100,000), never each partner's
#     individually verified amount -- specification.md's domain requires
#     that individual verification before the combined-income branch may
#     be used (the Task 12 PR #14 second review finding). Rather than
#     inventing an income split IRD never published, these are recorded as
#     scope-boundary cases: needs_review, not the IRD-stated dollar figure.
status: pending_review

benchmarks:
  - id: ird_ftc_sarah_full_credit
    ird_source: wff-ird-family-tax-credit
    ird_example_name: "Sarah gets the full family tax credit"
    outcome_kind: numeric_match
    benchmarked_components: [family_tax_credit]
    modelled_date: 2026-06-01
    scenario:
      household_eligibility: verified
      extra_instalment_status: verified
      partner_status: single
      family_scheme_income: {claimant_amount: "37800"}
      net_family_scheme_income: null
      net_family_scheme_income_me3_attested: false
      in_work_eligibility: unknown
      ftc_iwtc_protected_or_direct_abatement: verified
      mc6a_veterans_payment: verified
      mc6b_disqualifying_payment: verified
      minimum_family_full_time_earner_weeks: unknown
      best_start_no_shared_care: verified
      best_start_protected_credit: verified
      children:
        - qualifies_whole_year: verified
          best_start_cohort: unknown
          best_start_no_disqualifying_payment: unknown
        - qualifies_whole_year: verified
          best_start_cohort: unknown
          best_start_no_disqualifying_payment: unknown
    expected:
      family_tax_credit: {outcome: calculated, value: "14375"}
      in_work_tax_credit: {outcome: needs_review}
      minimum_family_tax_credit: {outcome: needs_review}
      best_start: {outcome: needs_review}
    source_note: >
      IRD: "Sarah is a single mum with 2 dependent children: Emily (4) and
      Oliver (7 months). Her family income for the year is $37,800... In
      her case, it totals $14,375." Eldest $7,921 + additional $6,454 =
      $14,375, matching the approved parameters exactly, with no abatement
      since $37,800 is below the $44,900 threshold. In-work/minimum-family/
      Best Start are needs_review, not benchmarked -- Sarah's example does
      not state her employment hours, a net (after-tax) income figure, or
      either child's exact birth date, so those inputs are genuinely
      unverified from this example alone, not fabricated to force a
      result.

