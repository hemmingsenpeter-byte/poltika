      abatement-carryover mechanism `calculate_wff()` implements. Not
      asserted numerically for the same reason as the Rahui case above:
      only a combined $100,000 figure is published, never each partner's
      individual amount, so our calculator correctly returns needs_review
      for both credits rather than the two IRD-stated figures -- the
      MD 2(2)(c) carryover mechanism itself is independently confirmed
      against real numbers by test_wff.py's synthetic-fixture unit tests
      instead (Task 12), which is not constrained by this same
      partner-verification gap.

