      - "mc6b_disqualifying_payment"
      - "best_start_no_shared_care"
      - "best_start_protected_credit"
      - "children[].qualifies_whole_year"
    expected:
      family_tax_credit: {outcome: needs_review}
      in_work_tax_credit: {outcome: needs_review}
      minimum_family_tax_credit: {outcome: needs_review}
      best_start: {outcome: needs_review}
    source_note: >
      IRD (family tax credit page): "Claire and Laura... the family income
      for the year is $100,000... Because the abatement is larger than the
      full family tax credit, Claire and Laura will not get a family tax
      credit... the remaining abatement of $777.50 will come off their
      in-work tax credit." IRD (in-work tax credit page), continuing the
      same example: "$7,670 - $777.50 = $6,892.50" -- together a real
      published, cross-page confirmation of exactly the MD 2(2)(c)
      abatement-carryover mechanism `calculate_wff()` implements. Not
      asserted numerically for the same reason as the Rahui case above:
      IRD's $100,000 is a household total, not either partner's
      individually verified amount -- `family_scheme_income: null` is the
      honest representation (an earlier revision incorrectly put the
      household figure into `claimant_amount`, misrepresenting it as one
      person's amount; PR #16 review finding). Our calculator correctly
      returns needs_review for both credits via the ordinary
      "family_scheme_income not verified" path, rather than the two
      IRD-stated figures -- the MD 2(2)(c) carryover mechanism itself is
      independently confirmed against real numbers by test_wff.py's
      synthetic-fixture unit tests instead (Task 12), which is not
      constrained by this same partner-verification gap.

  - id: ird_iwtc_brooklyn_direct_abatement_pathway_out_of_scope
    ird_source: wff-ird-in-work-tax-credit
    ird_example_name: "Brooklyn gets an in-work tax credit but not a family tax credit"
    outcome_kind: scope_boundary
    benchmarked_components: [family_tax_credit, in_work_tax_credit]
    modelled_date: 2026-06-01
    scenario:
      household_eligibility: verified
      extra_instalment_status: verified
      partner_status: single
      family_scheme_income: {claimant_amount: "47000"}
      net_family_scheme_income: null
      net_family_scheme_income_me3_attested: false
      in_work_eligibility: verified
      ftc_iwtc_protected_or_direct_abatement: excluded
      mc6a_veterans_payment: verified
      mc6b_disqualifying_payment: verified
      minimum_family_full_time_earner_weeks: unknown
      best_start_no_shared_care: verified
      best_start_protected_credit: verified
      children:
        - {qualifies_whole_year: verified, best_start_cohort: unknown, best_start_no_disqualifying_payment: unknown}
    assumed_facts:
      - "household_eligibility"
      - "extra_instalment_status"
      - "in_work_eligibility"
      - "mc6a_veterans_payment"
      - "mc6b_disqualifying_payment"
      - "best_start_no_shared_care"
      - "best_start_protected_credit"
      - "children[].qualifies_whole_year"
    expected:
      family_tax_credit: {outcome: unsupported}
      in_work_tax_credit: {outcome: unsupported}
      minimum_family_tax_credit: {outcome: needs_review}
      best_start: {outcome: needs_review}
    source_note: >
      IRD: "Brooklyn... receives an unsupported child's benefit for
      Jack... She cannot get a family tax credit because she receives an
      unsupported child's benefit... An abatement applies to the in-work
      tax credit... $7,670 - $577.50 = $7,092.50." A real published
      instance of exactly the "claimant cannot receive family tax credit
      for a child due to a different payment" direct-abatement pathway
      specification.md marks unsupported in v0.1 ("the separate
      direct-abatement pathway requires review and is unsupported in this
      scope"). Our `ftc_iwtc_protected_or_direct_abatement` field
      deliberately bundles the MD 14/15 protected-credit case and this
      direct-abatement pathway as one shared trigger (already reviewed and
      accepted in PR #14/#15), which is why family_tax_credit's own
      `unsupported` reason string here reads "MD 14/15" even though
      Brooklyn's real trigger is the broader "different payment" case --
      a known wording-precision limitation of that existing shared field,
      not a new issue, noted here rather than silently accepted. IRD's
      $7,092.50 is deliberately not asserted: our calculator correctly
      declines to compute it in this scope, rather than reproducing the
      alternate formula IRD applies for this pathway.

  - id: ird_faraj_in_year_birth_fails_whole_year_domain
    ird_source: wff-ird-best-start
    ird_example_name: "When the Faraj family's Best Start payments start"
    outcome_kind: scope_boundary
    benchmarked_components: [family_tax_credit, in_work_tax_credit, minimum_family_tax_credit, best_start]
    modelled_date: 2026-06-01
    scenario:
      household_eligibility: verified
      extra_instalment_status: verified
      partner_status: partnered
      family_scheme_income: null
      net_family_scheme_income: null
      net_family_scheme_income_me3_attested: false
      in_work_eligibility: unknown
      ftc_iwtc_protected_or_direct_abatement: verified
      mc6a_veterans_payment: verified
      mc6b_disqualifying_payment: verified
      minimum_family_full_time_earner_weeks: unknown
      best_start_no_shared_care: verified
      best_start_protected_credit: verified
      children:
        - qualifies_whole_year: excluded
          best_start_cohort: other_cohort_unsupported
          best_start_no_disqualifying_payment: unknown
    assumed_facts:
      - "household_eligibility"
      - "extra_instalment_status"
      - "ftc_iwtc_protected_or_direct_abatement"
      - "mc6a_veterans_payment"
      - "mc6b_disqualifying_payment"
      - "best_start_no_shared_care"
      - "best_start_protected_credit"
    expected:
      family_tax_credit: {outcome: unsupported}
      in_work_tax_credit: {outcome: unsupported}
      minimum_family_tax_credit: {outcome: unsupported}
      best_start: {outcome: unsupported}
    source_note: >
      IRD: "Samira Faraj and her partner Malik are expecting a baby...
      Baby Azra is born on 1 June 2026... The Faraj family earn $83,500
      for the 2027 tax year... A full entitlement for a year: $4,041 -
      $945 (abatement) = $3,096." Azra's 1 June 2026 birth date is real
      and stated directly by IRD, not inferred: the 2026-27 tax year runs
      2026-04-01 to 2027-03-31, so a child born 1 June 2026 was not in the
      claimant's care for the whole tax year -- specification.md's v0.1
      domain requires exactly that ("under 18 ... throughout the tax
      year"). `children[].qualifies_whole_year` is therefore `excluded`,
      a source-stated fact rather than an assumption (removed from
      `assumed_facts` for that reason), and PR #16's review correctly
      identified an earlier revision's `verified` here as wrong. Since a
      household gate applies to every component before any
      component-specific logic runs, this now makes ALL FOUR components
      `unsupported`, not just best_start -- `benchmarked_components`
      widened accordingly. `best_start_cohort: other_cohort_unsupported`
      remains an accurate secondary fact about Azra (she is also outside
      the narrow 2024-04-01..2025-03-31 v0.1 Best Start cohort), but the
      household gate is reached first and is what actually determines this
      case's outcome, so the cohort-specific mechanism this case
      previously claimed to demonstrate is not the one actually exercised
      here -- that mechanism is exercised in isolation by
      `spec_cases.yaml`'s own hand-derived Best Start cohort cases
      instead (Task 13). IRD's own $3,096 figure is real statutory law for
      Azra's actual case; it is deliberately not asserted here because it
      is genuinely outside what this v0.1 branch calculates. This is also
      the only Best Start worked example IRD publishes; no in-scope
      numeric Best Start benchmark exists in current IRD guidance.
