  - id: ird_ftc_sarah_full_credit
    ird_source: wff-ird-family-tax-credit
    ird_example_name: "Sarah gets the full family tax credit"
    outcome_kind: conditional_arithmetic_match
    benchmarked_components: [family_tax_credit]
    modelled_date: 2026-06-01
    scenario:
      household_eligibility: verified
      extra_instalment_status: verified
      partner_status: single
      family_scheme_income: {claimant_amount: "37800"}
      net_family_scheme_income: null
      net_family_scheme_income_me3_attested: false
      in_work_eligibility: unknown
      ftc_iwtc_protected_or_direct_abatement: verified
      mc6a_veterans_payment: verified
      mc6b_disqualifying_payment: verified
      minimum_family_full_time_earner_weeks: unknown
      best_start_no_shared_care: verified
      best_start_protected_credit: verified
      children:
        - qualifies_whole_year: verified
          best_start_cohort: unknown
          best_start_no_disqualifying_payment: unknown
        - qualifies_whole_year: verified
          best_start_cohort: unknown
          best_start_no_disqualifying_payment: unknown
    assumed_facts:
      - "household_eligibility"
      - "extra_instalment_status"
      - "ftc_iwtc_protected_or_direct_abatement"
      - "mc6a_veterans_payment"
      - "mc6b_disqualifying_payment"
      - "best_start_no_shared_care"
      - "best_start_protected_credit"
      - "children[].qualifies_whole_year"
    expected:
      family_tax_credit: {outcome: calculated, value: "14375"}
      in_work_tax_credit: {outcome: needs_review}
      minimum_family_tax_credit: {outcome: needs_review}
      best_start: {outcome: needs_review}
    source_note: >
      IRD: "Sarah is a single mum with 2 dependent children: Emily (4) and
      Oliver (7 months). Her family income for the year is $37,800... In
      her case, it totals $14,375." Eldest $7,921 + additional $6,454 =
      $14,375, matching the approved parameters exactly, with no abatement
      since $37,800 is below the $44,900 threshold. In-work/minimum-family/
      Best Start are needs_review, not benchmarked -- Sarah's example does
      not state her employment hours, a net (after-tax) income figure, or
      either child's exact birth date, so those inputs are genuinely
      unverified from this example alone, not fabricated to force a
      result.

