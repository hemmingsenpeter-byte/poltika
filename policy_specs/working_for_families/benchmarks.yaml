# Task 14: benchmark tests against independently published IRD worked
# examples, per doctrine/test-doctrine.md's "Benchmark tests for expected
# statutory values" class and BUILD_PLAN.md's "checked against
# independently published IRD/MSD/Treasury worked examples. This is what
# prevents AI-on-AI validation from being the only check." This file is one
# of .github/workflows/statutory-value-guard.yml's protected paths.
#
# ## What these cases prove, precisely (PR #16 review correction)
#
# A `conditional_arithmetic_match` case does NOT prove "this household is
# verified to receive this dollar amount under the approved spec." It
# proves a narrower thing: IF the facts an IRD worked example actually
# states are true, AND IF a listed set of further facts the example is
# silent on (`assumed_facts` on each case) also hold in the ordinary way
# IRD's own narrative implies -- no shared care, no benefit receipt, no
# protected-credit month, a stable whole-year household -- THEN
# `calculate_wff()` reproduces IRD's published figure exactly. Every case's
# `assumed_facts` list names precisely which `scenario` fields are held at
# `verified` (or otherwise asserted) without the cited IRD text actually
# stating them, so the source-stated facts and the arithmetic-isolating
# assumptions are never presented as the same kind of evidence. An earlier
# revision of this file's header claimed "everything the example doesn't
# cover [is] left genuinely unverified" -- that was not accurate for these
# assumed household-level facts, and is corrected here.
#
# A case whose `benchmarked_components` includes `in_work_tax_credit` (and
# is `conditional_arithmetic_match`, not `scope_boundary`) carries one
# further, more important conditionality: the synthetic fixture (below)
# marks `in_work_base` approved at $7,670 for the whole 2026-27 year, but
# specification.md's Task 10.2 rate-status contract is explicit that an
# unchecked future reversal Order means an unconditional full-year result
# is `needs_review`, and "a no-future-Order projection is a separately
# labelled scenario assumption, not verified law or a benchmark." IRD's own
# in-work tax credit page agrees the rate "may reduce back to $97" on a
# petrol-price condition. So `ird_iwtc_jaimee_full_credit_beyond_three_
# children` proves only: IF the full-year $7,670 rate holds (which is not
# yet verified law for the whole tax year -- see `spec_cases.yaml`'s own
# cases for that live gate), THEN the formula reproduces IRD's $9,230.
# This is listed explicitly in that case's `assumed_facts`, not left
# implicit in the synthetic fixture's approval.
#
# Every `expected` numeric value for a case's *benchmarked* component(s) is
# copied verbatim from the cited IRD page's own stated worked-example
# result, with the exact wording quoted in `source_note` for traceability.
# Two documented exceptions, corrected here rather than left as an
# overclaim: `ird_iwtc_jaimee_full_credit_beyond_three_children`'s
# family_tax_credit figure ($33,737) is a side computation from the same
# stated income, not itself benchmarked (IRD's in-work tax credit page
# never states a family tax credit figure for Jaimee); and
# `ird_mftc_casey_zero_over_income_limit`'s $0 is this project's semantic
# reading of IRD's stated "no longer qualifies" ("net income at or above
# the prescribed amount yields no positive top-up" -- specification.md),
# not a literal digit IRD prints on the page. This is the opposite
# discipline from spec_cases.yaml (Task 13), where every value was
# hand-derived independently from specification.md -- here, the whole
# point for a case's benchmarked component(s) is a THIRD PARTY's number,
# fetched directly from ird.govt.nz (via a browser-user-agent request,
# since a bare fetch 403'd -- the same access pattern already used
# elsewhere in this repo) on 2026-09-22.
#
# `benchmarked_components` names which component(s) each case is actually
# checking a published (or, for the two exceptions above, clearly labelled
# non-published) number against. The other components in `expected` are
# not benchmarked against a published figure, but every case still asserts
# all four -- consistent with the completeness discipline PR #15's review
# established for spec_cases.yaml -- recording whatever calculate_wff()
# honestly produces given exactly the facts that specific IRD example
# actually states plus its listed `assumed_facts`.
#
# All four IRD pages this file draws from explicitly confirm 2026-27 rates
# ($7,921/$6,454/$44,900/27.5% family tax credit; $7,670/$780 in-work;
# $36,604/$703 minimum family; $4,041/$79,000/21% Best Start, and the Best
# Start page states outright: "In the examples we use the rates for the
# 2026-2027 tax year"). specification.md's own reviewed rates match these
# exactly -- an independent cross-check in itself. Every example's stated
# result is explicitly an ANNUAL figure (IRD labels each one "(for the
# year)"/"full-year entitlement"), never a weekly/fortnightly instalment
# treated as if it were the annual amount -- the specific trap
# specification.md warns against.
#
# All cases run against a synthetic fixture carrying the same statutory
# rates as the real approved policy.yaml (policy_version 0.1.0), but with
# every parameter -- including in_work_base -- marked approved, the same
# design test_wff.py (Task 12) already established: this isolates the
# arithmetic/scope-boundary check from the separate, already-protected
# in_work_base rate-status gate (spec_cases.yaml, Task 13). It does NOT
# mean the full-year $7,670 rate is being treated as verified law here --
# see the in-work tax credit conditionality note above. Two of these cases
# (Brooklyn's direct-abatement exclusion, Faraj's birth-cohort exclusion)
# specifically need this fixture to prove their exclusion is a real
# scenario-level fact, not an artifact of the live rate gate.
#
# Two IRD-published examples were deliberately NOT promoted as in-scope
# numeric benchmarks, each for a reason discovered by checking the
# specification.md text directly rather than assumed by analogy:
#   - Casey's minimum family tax credit example (self-employed income plus
#     a qualifying salaried job) was initially assumed out of scope by
#     loose analogy with specification.md's in-work tax credit domain
#     paragraph, which narrows that component's v0.1 branch to exclude
#     self-employment pending further review -- note this is our own
#     spec's scope decision, not an IRD rule: IRD's in-work tax credit page
#     states plainly that self-employment income DOES qualify for in-work
#     tax credit ("You'll qualify for an in-work tax credit if you're
#     self-employed"). Re-reading specification.md's minimum family tax
#     credit domain paragraph directly shows no analogous exclusion exists
#     for that component, so Casey's example is promoted as in-scope after
#     all.
#   - Rahui's and Claire & Laura's family tax credit examples give only a
#     combined partnered family income ($100,000), never each partner's
#     individually verified amount -- specification.md's domain requires
#     that individual verification before the combined-income branch may
#     be used (the Task 12 PR #14 second review finding). Rather than
#     inventing an income split IRD never published, these are recorded as
#     scope-boundary cases: needs_review, not the IRD-stated dollar figure.
#
# status: approved 22 September 2026, PR #16. GPT/Codex's fresh-context
# Task 14 review found and Claude Code fixed, across two rounds: (1) an
# overclaim about what the cases prove (household-level exclusion-trigger
# facts held `verified` without the cited IRD text stating them, resolved
# with the `assumed_facts` field and the `conditional_arithmetic_match`
# outcome kind), the Jaimee case's unflagged dependency on the still-live
# Task 10.2 in_work_base rate question, and two provenance statements; (2)
# Faraj's child wrongly marked qualifying for the whole tax year despite
# IRD's stated in-year birth date, and three partnered cases mislabelling
# a published household income as one person's individually verified
# amount. Pete recommended acceptance and delegated the final accept
# decision to Claude Code, matching Task 13's pattern. Immediately before
# this status change, re-verified pytest (108/108), ruff, and
# mypy --strict all pass and re-confirmed both second-round findings are
# actually present in the merged state. Changes no test values or
# calculation behaviour -- per this file's own discipline, this status
# field records review acceptance only.
status: approved

