# Task 10 approved scoped specification; observe per-parameter review gates.
schema_version: "0.1"
policy_id: working_for_families
policy_version: "0.1.0"
status: approved
reference_period:
  from: 2026-04-01
  to: 2027-04-01
source_catalog: sources.yaml

assessment:
  unit: family_scheme
  roles: [claimant, partner, dependent_child]
  membership_period: tax_year
  supported_domain: stable_membership_full_tax_year
  source_rule_ids: [WFF-01, WFF-02, WFF-07]
  unsupported:
    - relationship_change
    - shared_care
    - part_year_child_eligibility
    - competing_claimant_or_mc7_allocation
    - mc9_age_18_extension
    - mc5_alternative_residence_route

inputs:
  - id: assessment_date
    owner: assessment_unit
    type: date
    period: day
    source_rule_ids: [WFF-01, WFF-09]
    missing_outcome: needs_review
  - id: eligibility_facts
    owner: person
    type: documented_eligibility_facts
    period: full_tax_year
    source_rule_ids: [WFF-01]
    missing_outcome: needs_review
    note: Verify the claimant's MC 5(2) residence pathway, including prior 12-month residence/presence, daily residence, and transitional-resident exclusion; also verify MC 10(1) principal-care exclusions. Other MC 5 pathways are outside the initial branch.
  - id: children
    owner: person
    type: list_of_dated_child_facts
    period: full_tax_year
    source_rule_ids: [WFF-01, WFF-06, WFF-07]
    missing_outcome: needs_review
    note: Initial branch requires each child to remain under 18 and in the claimant's full care throughout the tax year; MC 7 and MC 9 exceptions need separate review.
  - id: family_scheme_income
    owner: assessment_unit
    type: verified_amount
    unit: NZD_per_tax_year
    period: full_tax_year
    source_rule_ids: [WFF-02]
    missing_outcome: needs_review
    note: Independently verified under subpart MB, including any partner-wide MB 13 threshold and child-income allocation. Partnered cases need each person's amount and the combined amount; this branch uses the combined amount only when both individual amounts are non-negative. Wages alone are insufficient.
  - id: work_and_payment_facts
    owner: person
    type: dated_income_and_government_payment_facts
    period: full_tax_year
    source_rule_ids: [WFF-04, WFF-05, WFF-06, WFF-08]
    missing_outcome: needs_review
  - id: net_family_scheme_income
    owner: assessment_unit
    type: verified_amount
    unit: NZD_per_tax_year_after_tax
    period: full_tax_year
    source_rule_ids: [WFF-05]
    required_for: minimum_family_tax_credit
    missing_outcome: needs_review
    note: Distinct from family_scheme_income; verification must attest to the ME 3 adjusted-income, adjusted-tax-liability, amount-received, and amount-paid derivation.
  - id: paid_parental_leave_periods
    owner: person
    type: dated_intervals
    period: tax_year
    source_rule_ids: [WFF-06]
    required_for: best_start
    missing_outcome: needs_review
  - id: extra_instalment_status
    owner: person
    type: verified_section_80kw_applicability
    period: full_tax_year
    source_rule_ids: [WFF-09]
    missing_outcome: needs_review
    note: An applicable 27-fortnight or 53-week payment year is outside the ordinary annual branch; do not assume it cannot occur.

parameters:
  - id: family_tax_credit_eldest_child
    value_type: money
    unit: NZD_per_tax_year
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 7921, source_id: wff-tax-credit-order-2025, locator: 'clause 4; Income Tax Act s MD 3(4)(a)', review_status: approved}
  - id: family_tax_credit_additional_child
    value_type: money
    unit: NZD_per_tax_year
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 6454, source_id: wff-tax-credit-order-2025, locator: 'clause 4; Income Tax Act s MD 3(4)(b)', review_status: approved}
  - id: family_tax_credit_abatement_threshold
    value_type: money
    unit: NZD_per_tax_year
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 44900, source_id: wff-budget-measures-2025, locator: 'section 7; Income Tax Act s MD 13(3)(a)(i)', review_status: approved}
  - id: family_tax_credit_abatement_rate
    value_type: fraction
    unit: NZD_per_complete_NZD_above_threshold
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 0.275, source_id: wff-budget-measures-2025, locator: 'section 7; Income Tax Act s MD 13(3)(a)(i)', review_status: approved}
  - id: in_work_base
    value_type: money
    unit: NZD_per_tax_year
    values:
      - effective_from: 2026-04-01
        effective_to: 2027-04-01
        value: 7670
        source_id: wff-iwtc-increase-act-2026
        locator: sections 2 and 105; Income Tax Act s MD 10(3)(a)
        review_status: needs_review
        note: Candidate upper-bound interval only. Section 105(1) made 7670 operative from 2026-04-01, but s 105(2) may reverse it to 5070 on an earlier Order date; otherwise reversal occurs on 2027-04-01. The 2026-09-21 no-Order check does not verify the rest of 2026-27. Do not use this row alone for an unconditional full-year result; apply the rate-status outcomes in specification.md and recheck at implementation.
  - id: in_work_additional_child
    value_type: money
    unit: NZD_per_tax_year
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 780, source_id: wff-income-tax-act, locator: 'section MD 10(3)(b)', review_status: approved}
  - id: minimum_family_prescribed_amount
    value_type: money
    unit: NZD_per_tax_year_after_tax
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 36604, source_id: wff-tax-credit-order-2025, locator: 'clause 5; Income Tax Act s ME 1(3)(a)', review_status: approved}
  - id: best_start_annual_amount
    value_type: money
    unit: NZD_per_child_per_tax_year
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 4041, source_id: wff-tax-credit-order-2025, locator: 'clause 6; Income Tax Act s MG 2', review_status: approved}
  - id: best_start_abatement_threshold
    value_type: money
    unit: NZD_per_tax_year
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 79000, source_id: wff-income-tax-act, locator: 'section MG 3', review_status: approved}
  - id: best_start_abatement_rate
    value_type: fraction
    unit: NZD_per_complete_NZD_above_threshold
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 0.21, source_id: wff-income-tax-act, locator: 'section MG 3', review_status: approved}

components:
  - id: family_tax_credit
    source_rule_ids: [WFF-01, WFF-02, WFF-03, WFF-07, WFF-08]
    output_id: family_tax_credit_annual
    # Task 10.3 finding: consolidate this component's known exclusion
    # triggers here (previously prose-only across the calculation sequence)
    # so an implementer working from policy.yaml alone can't miss one.
    validation_checks:
      - mc6a_veterans_payment
      - md14_15_protected_credit
      - s80kw_extra_instalment
  - id: in_work_tax_credit
    source_rule_ids: [WFF-01, WFF-02, WFF-04, WFF-08]
    output_id: in_work_tax_credit_annual
    validation_checks:
      - mc6a_veterans_payment
      - mc6b_disqualifying_payment
      - md14_15_protected_credit_or_direct_abatement_pathway
      - in_work_eligibility
      - s80kw_extra_instalment
  - id: minimum_family_tax_credit
    source_rule_ids: [WFF-01, WFF-05, WFF-08]
    output_id: minimum_family_tax_credit_annual
    validation_checks:
      - mc6b_disqualifying_payment
      - me2_2_4_employment_exclusion
      - me3_net_income_attestation
      - s80kw_extra_instalment
  - id: best_start
    source_rule_ids: [WFF-01, WFF-06, WFF-07]
    output_id: best_start_annual
    validation_checks:
      - mc6a_veterans_payment
      - mc6c_disqualifying_payment
      - mg4_protected_credit
      - shared_care
      - s80kw_extra_instalment

outputs:
  unit: NZD_per_tax_year
  components: [family_tax_credit_annual, in_work_tax_credit_annual, minimum_family_tax_credit_annual, best_start_annual]
  # `ineligible` (ADR-0014, 26 September 2026): an evidenced eligibility-test
  # failure, reported with value 0 -- specification.md's "may yield zero".
  outcome_states: [calculated, ineligible, unsupported, needs_review]
  note: Annual entitlement is not a weekly or fortnightly instalment.
