# Task 13: independently hand-calculated spec-test cases, loaded by
# tests/unit/engines/simulator/test_wff_spec_cases.py rather than hardcoded
# into that test file's Python -- per ADR-0005's design ("hand-calculated
# spec-test expected values, loaded by Task 13 tests rather than
# hardcoded") and the Test Doctrine's "Spec tests -- hand-calculated from
# POLICY_SPECS, protected" class. This file is one of
# .github/workflows/statutory-value-guard.yml's protected paths: any PR
# that changes it shows up flagged for review before merge (ADR-0007).
#
# Every `expected` value below was independently derived from
# specification.md's "Approved Task 10 scoped calculation contract" and the
# approved policy.yaml's parameters (policy_version 0.1.0) using a
# standalone calculation, not by running or reading
# src/poltika/engines/simulator/wff.py and copying its output -- that would
# make this file circular and unable to catch an implementation bug. Each
# case's `source_note` records the by-hand arithmetic.
#
# Every case is evaluated against the *real* approved
# policy_specs/working_for_families/policy.yaml via Task 11's loader, at
# `modelled_date` within the 2026-04-01..2027-04-01 reference period. This
# is deliberate, not an oversight: `in_work_base`'s `review_status:
# needs_review` (the Task 10.2 rate-status contract) is a live legal fact
# about that real, approved policy record, not a synthetic test fixture --
# so in_work_tax_credit is `needs_review` in every case below unless a
# higher-precedence exclusion (e.g. MC 6(a)/(b), or a household-wide gate)
# already makes it `unsupported`. That is correct, protected behaviour, not
# a bug to "fix" by asserting an unconditional $7,670.
#
# status: approved 22 September 2026, PR #15. GPT/Codex's fresh-context
# Task 13 review found and Claude Code fixed three issues before
# acceptance: a missing MD 14/15 case, a test-runner gap that would have
# let a case with an incomplete `expected` block pass silently, and a
# documentation sentence that understated how many cases return
# in_work_tax_credit: unsupported (6, not the originally claimed 2 --
# corrected in specification.md). Pete recommended acceptance and
# delegated the final accept decision to Claude Code, which re-verified
# pytest/ruff/mypy --strict and every prior finding's resolution
# immediately before this status change -- matching how policy.yaml's own
# status field was handled through Task 10, except Pete named Claude Code
# as decision-maker for this specific acceptance rather than deciding it
# personally.
#
# ADR-0014 (26 September 2026, Pete's decision): Best Start for a household
# whose every child is verified outside Best Start entitlement is reported
# as `ineligible` with value 0, not `calculated` 0 -- an evidenced
# eligibility-test failure, per specification.md's "may yield zero for that
# component". Only the outcome label changed; every value is unchanged, and
# no other expectation moved.
status: approved

