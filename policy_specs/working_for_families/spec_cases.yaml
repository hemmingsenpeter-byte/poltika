      mc6b_disqualifying_payment: verified
      minimum_family_full_time_earner_weeks: verified
      best_start_no_shared_care: verified
      best_start_protected_credit: verified
      children:
        - qualifies_whole_year: verified
          best_start_cohort: in_supported_cohort
          best_start_no_disqualifying_payment: verified
    expected:
      family_tax_credit: {outcome: needs_review}
      in_work_tax_credit: {outcome: needs_review}
      minimum_family_tax_credit: {outcome: needs_review}
      best_start: {outcome: needs_review}
    source_note: >
      Family tax credit and Best Start both use family_scheme_income's
      combined figure, which can't be trusted as correct without knowing
      whether a partner exists (Task 12 second PR #14 review finding).
      Minimum family tax credit's own MA 7 full-time-earner test has a
      different hour threshold for a single claimant (20 hours) than a
      partnered one (30 combined hours) per specification.md, so an
      unverified partner status blocks it too, independently of income
      combination (Task 12 third PR #14 review finding). In-work tax
      credit inherits family tax credit's needs_review via MD 2(2)(c).

