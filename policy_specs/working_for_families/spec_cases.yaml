  - id: half_cent_precision_exact_decimal_result
    description: >
      Income one complete dollar above the family tax credit abatement
      threshold -- the 27.5-cent rate produces an exact half-cent result
      that must not be rounded.
    modelled_date: 2026-06-01
    policy_version: "0.1.0"
    scenario:
      household_eligibility: verified
      extra_instalment_status: verified
      partner_status: single
      family_scheme_income: {claimant_amount: "44901"}
      net_family_scheme_income: "30000"
      net_family_scheme_income_me3_attested: true
      in_work_eligibility: verified
      ftc_iwtc_protected_or_direct_abatement: verified
      mc6a_veterans_payment: verified
      mc6b_disqualifying_payment: verified
      minimum_family_full_time_earner_weeks: verified
      best_start_no_shared_care: verified
      best_start_protected_credit: verified
      children:
        - qualifies_whole_year: verified
          best_start_cohort: outside_best_start_entitlement
          best_start_no_disqualifying_payment: verified
    expected:
      family_tax_credit: {outcome: calculated, value: "7920.725"}
      in_work_tax_credit: {outcome: needs_review}
      minimum_family_tax_credit: {outcome: calculated, value: "6604"}
      best_start: {outcome: ineligible, value: "0"}
    source_note: >
      Excess = $44901 - $44900 = $1 complete dollar; abatement = 0.275 x 1
      = $0.275 exactly; FTC = $7921 - $0.275 = $7920.725. specification.md
      explicitly anticipates this half-cent result and requires it be
      preserved exactly, not rounded, in the calculation core.
