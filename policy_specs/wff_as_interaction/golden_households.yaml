    derivation: >-
      WFF: no dependent child, so unsupported; in-work eligibility and MC 6(b) are recorded as
      excluded (a main benefit is received), as are the MD 14/15 and MG 4 protected-credit facts
      (Task 34.3 F1: a main benefit with income under the thresholds makes a protected month), so
      no main-benefit disagreement. AS: Jobseeker single
      threshold $93; 70% x ($250 - $93) = $109.90, capped at the cl 3 Area 4 cap of $70; no income
      test; $70.
    precondition: verified
    wff:
      <<: *wff_single_earner
      family_scheme_income: {claimant_amount: '19000'}
      net_family_scheme_income: '19000'
      in_work_eligibility: excluded
      mc6b_disqualifying_payment: excluded
      ftc_iwtc_protected_or_direct_abatement: excluded
      best_start_protected_credit: excluded
      children: []
    accommodation_supplement:
      <<: *as_base
      claimant_category: jobseeker_support
      statistical_area_unit: area4
      weekly_accommodation_costs: '250'
      dependent_children_count: 0
      cash_assets: '500'
      weekly_income: null
      eldest_dependent_child_under_16: unknown
    expected:
      contradictions: 0
      wff:
        family_tax_credit: {outcome: unsupported}
        in_work_tax_credit: {outcome: unsupported}
        minimum_family_tax_credit: {outcome: unsupported}
        best_start: {outcome: unsupported}
      accommodation_supplement: {outcome: calculated, value: '70'}

  - id: g5_supported_living_couple_two_children
    why: Beneficiary couple; AS calculated, every WFF component unsupported by the main benefit.
    derivation: >-
      WFF: combined $25,000 + $15,000 = $40,000, below $44,900, with a Supported Living Payment
      received, so the months are MD 14(1)(b) protected family tax credit and MG 4(1)(b) protected
      Best Start months (conservatively: the benefit may be the partner's). The approved WFF
      specification (steps 2 and 5) makes an established protected month unsupported, so FTC, IWTC
      and Best Start are unsupported; in-work eligibility and MC 6(b) are excluded, so MFTC is
      unsupported too. Corrected by Task 34.3 F1 (was FTC $14,375, Best Start $0). AS: Supported Living couple-with-
      children threshold $227; 70% x ($500 - $227) = $191.10, under the cl 1 Area 2 cap of $220; no
      income test; r 19 gives $192.
    precondition: verified
    wff:
      <<: *wff_single_earner
      partner_status: partnered
      family_scheme_income: {claimant_amount: '25000', partner_amount: '15000'}
      net_family_scheme_income: '40000'
      in_work_eligibility: excluded
      mc6b_disqualifying_payment: excluded
      ftc_iwtc_protected_or_direct_abatement: excluded
      best_start_protected_credit: excluded
    accommodation_supplement:
      <<: *as_base
      claimant_category: supported_living_payment
      partner_status: ordinary_couple
      weekly_accommodation_costs: '500'
      cash_assets: '1000'
      weekly_income: null
    expected:
      contradictions: 0
      wff:
        family_tax_credit: {outcome: unsupported}
        in_work_tax_credit: {outcome: unsupported}
        minimum_family_tax_credit: {outcome: unsupported}
        best_start: {outcome: unsupported}
      accommodation_supplement: {outcome: calculated, value: '192'}

