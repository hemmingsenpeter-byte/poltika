      WFF: income $45,500, excess $600, abatement $165, FTC $7,756; IWTC needs_review; MFTC $0;
      Best Start $0. AS: sole-parent threshold $168; 70% x ($420 - $168) = $176.40, under the cl 2
      Area 1 cap of $235; cash $7,000 is $1,600 over the $5,400 threshold, 16 complete $100 steps,
      $16 imputed; income $895 + $16 = $911, over $906 by $5, reduction $1.25; $175.15, r 19 gives $176.
    precondition: verified
    wff:
      <<: *wff_single_earner
      family_scheme_income: {claimant_amount: '45500'}
      net_family_scheme_income: '45500'
      children:
        - {qualifies_whole_year: verified, best_start_cohort: outside_best_start_entitlement, best_start_no_disqualifying_payment: verified}
