# Task 29: golden household suite across WFF and Accommodation Supplement.
#
# Nine complete households run through the combined household runner (Task
# 28.4) against the real approved policies (WFF 0.1.0, AS 0.1.2) with the
# Task 28.2 dates -- WFF 2026-27 year, lookup 2026-06-01; AS week
# [2026-06-01, 2026-06-08), lookup 2026-06-01 -- and NO parameter
# assumptions. Protected by the statutory-value guard.
#
# 29.1: household list proposed by Claude Code and approved under Pete's
# delegation ("do all of this for me -- keep going", 24 September 2026).
# 29.2: expected values hand-calculated by Claude Code from the approved
# policy.yaml values and the specifications' calculation sequences, by a
# standalone script independent of the calculators; each is re-derived by a
# fresh-context reviewer (29.4). The in-work tax credit is needs_review
# wherever it is reached: the 2026-27 in-work base is gated (Task 26b).
#
# Parameter values used (from the policy files): WFF eldest $7,921,
# additional $6,454, abatement 27.5% of complete dollars over $44,900, MFTC
# prescribed $36,604, Best Start $4,041 abating 21% over $79,000. AS
# thresholds, caps, income levels and asset settings as cited per household.
#
# No household depends on DEC-001's medium-confidence convention: every AS
# income excess here is a whole-dollar amount, so flooring first would give
# the same result (Task 29.2 flag: none). Each WFF net family scheme income
# is a synthetic, attested ME 3 amount set equal to gross for clear
# arithmetic; it does not model an actual tax liability.
#
# ADR-0014 (26 September 2026, Pete's decision): Best Start for a household
# whose every child is verified outside Best Start entitlement is reported
# as `ineligible` with value 0, not `calculated` 0 -- an evidenced
# eligibility-test failure, per specification.md's "may yield zero for that
# component". Only the outcome label changed; every value is unchanged, and
# no other expectation moved.
status: approved
households:
  - id: g1_sole_parent_two_children_non_beneficiary
    why: Both policies calculated; sole parent with 2+ children uses the cl 1 cap.
    derivation: >-
      WFF: FTC $7,921 + $6,454 = $14,375 (income $35,000 below $44,900); IWTC needs_review; MFTC
      $36,604 - $35,000 = $1,604; Best Start $0. AS: non-beneficiary sole-parent threshold $168;
      70% x ($450 - $168) = $197.40, under the cl 1 Area 2 cap of $220; income $673 below $906; assets
      $3,000 below $5,400; r 19 gives $198.
    precondition: verified
    wff: &wff_single_earner
      household_eligibility: verified
      extra_instalment_status: verified
      partner_status: single
      family_scheme_income: {claimant_amount: '35000'}
      net_family_scheme_income: '35000'
      net_family_scheme_income_me3_attested: true
      in_work_eligibility: verified
      ftc_iwtc_protected_or_direct_abatement: verified
      mc6a_veterans_payment: verified
      mc6b_disqualifying_payment: verified
      minimum_family_full_time_earner_weeks: verified
      best_start_no_shared_care: verified
      best_start_protected_credit: verified
      children: &two_children
        - {qualifies_whole_year: verified, best_start_cohort: outside_best_start_entitlement, best_start_no_disqualifying_payment: verified}
        - {qualifies_whole_year: verified, best_start_cohort: outside_best_start_entitlement, best_start_no_disqualifying_payment: verified}
    accommodation_supplement: &as_base
      household_eligibility: verified
      claimant_category: non_beneficiary
      tenure_type: rent_contributions_or_board
      partner_status: single
      statistical_area_unit: area2
      weekly_accommodation_costs: '450'
      dependent_children_count: 2
      cash_assets: '3000'
      exempt_cash_asset_status: verified
      weekly_income: '673'
      ordinary_rate_status: verified
      eldest_dependent_child_under_16: verified
    expected:
      contradictions: 0
      wff:
        family_tax_credit: {outcome: calculated, value: '14375'}
        in_work_tax_credit: {outcome: needs_review}
        minimum_family_tax_credit: {outcome: calculated, value: '1604'}
        best_start: {outcome: ineligible, value: '0'}
      accommodation_supplement: {outcome: calculated, value: '198'}

  - id: g2_couple_two_children_income_abated_both
    why: Partnered income verified per person; WFF abatement and AS income reduction both apply.
    derivation: >-
      WFF: combined $50,000 + $20,000 = $70,000; abatement 27.5% x $25,100 = $6,902.50; FTC $14,375 -
      $6,902.50 = $7,472.50; IWTC needs_review; MFTC $0 ($36,604 - $70,000 < 0); Best Start $0. AS:
      couple-with-children threshold $205; 70% x ($600 - $205) = $276.50, under the cl 1 Area 1 cap of
      $305; income $1,346 over the $1,117 level, reduction 25% x $229 = $57.25 (DEC-001); $219.25,
      r 19 gives $220. Assets $2,000 below $5,400.
    precondition: verified
    wff:
      <<: *wff_single_earner
      partner_status: partnered
      family_scheme_income: {claimant_amount: '50000', partner_amount: '20000'}
      net_family_scheme_income: '70000'
    accommodation_supplement:
      <<: *as_base
      partner_status: ordinary_couple
      statistical_area_unit: area1
      weekly_accommodation_costs: '600'
      cash_assets: '2000'
      weekly_income: '1346'
    expected:
      contradictions: 0
      wff:
        family_tax_credit: {outcome: calculated, value: '7472.5'}
        in_work_tax_credit: {outcome: needs_review}
        minimum_family_tax_credit: {outcome: calculated, value: '0'}
        best_start: {outcome: ineligible, value: '0'}
      accommodation_supplement: {outcome: calculated, value: '220'}

  - id: g3_childless_couple_as_only
    why: WFF excluded (no dependent child) while AS calculates.
    derivation: >-
      WFF: no dependent child, so every component is unsupported (outside the family-scheme
      domain). AS: couple-without-children threshold $158; 70% x ($300 - $158) = $99.40, under the
      cl 2 Area 3 cap of $105; income $1,000 below the $1,066 level; assets $5,000 below $5,400; r 19
      gives $100.
    precondition: verified
    wff:
      <<: *wff_single_earner
      partner_status: partnered
      family_scheme_income: {claimant_amount: '40000', partner_amount: '12000'}
      net_family_scheme_income: '52000'
      children: []
    accommodation_supplement:
      <<: *as_base
      partner_status: ordinary_couple
      statistical_area_unit: area3
      weekly_accommodation_costs: '300'
      dependent_children_count: 0
      cash_assets: '5000'
      weekly_income: '1000'
      eldest_dependent_child_under_16: unknown
    expected:
      contradictions: 0
      wff:
        family_tax_credit: {outcome: unsupported}
        in_work_tax_credit: {outcome: unsupported}
        minimum_family_tax_credit: {outcome: unsupported}
        best_start: {outcome: unsupported}
      accommodation_supplement: {outcome: calculated, value: '100'}

