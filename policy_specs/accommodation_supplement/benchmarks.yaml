# Task 24.1: official MSD examples. Numeric matches are conditional on the
# listed scenario facts and dated table inputs; they are not unconditional
# entitlement determinations. DEC-001 remains unpromoted because no second
# published fractional-income-excess example was found.
status: pending_review
benchmarks:
  - id: msd_nadiya_supported_living_rent
    msd_source: as-msd-rent-board-examples
    outcome_kind: conditional_arithmetic_match
    benchmarked_components: [accommodation_supplement]
    source_note: MSD publishes $104 per week from $375 rent less a $227 entry threshold, multiplied by 70%; the $220 Area 2 cap does not bind.
    assumed_facts:
      - No household exclusion or discretionary ground applies.
      - Cash assets are $0 and no exempt-asset issue applies.
      - The published $227 entry threshold is supplied directly as the entry-threshold assumption (DEC-002).
      - The ordinary published rate row applies (no excluded rate subtype).
      - The eldest dependent child is under 16 throughout the week (not stated by MSD; assumed for this arithmetic check).
    parameter_assumptions: {entry_threshold: '227'}
    scenario:
      household_eligibility: verified
      claimant_category: supported_living_payment
      tenure_type: rent_contributions_or_board
      partner_status: ordinary_couple
      statistical_area_unit: area2
      weekly_accommodation_costs: '375'
      dependent_children_count: 2
      cash_assets: '0'
      exempt_cash_asset_status: verified
      ordinary_rate_status: verified
      eldest_dependent_child_under_16: verified
      weekly_income: null
    expected: {accommodation_supplement: {outcome: calculated, value: '104'}}

