sources:
  - id: as-social-security-act
    kind: legislation
    title: Social Security Act 2018
    url: https://www.legislation.govt.nz/act/public/2018/32/en/latest/
    covers: Sections 65AAA to 69 and Schedule 4 Part 7; eligibility, costs, and rates.
    task_26a_check:
      checked_on: 2026-09-24
      versions_checked: [2026-04-01, 2026-09-04]
      audit_version_url: https://www.legislation.govt.nz/act/public/2018/32/en/2026-04-01/
      locator: Schedule 4 Part 1 clause 1(d); Part 7 clauses 1-3
      finding: The single ordinary Jobseeker rate is 372.55, while Part 7
        uses 25 percent of the regulation 17 base rate for rent or board.
        The statutory cap categories combine couples and sole parents;
        this does not establish that their base rates are equal.
      limitation: Research only. No new runtime value or date selection approved.
    task_22_check: Official "latest" consolidated text checked directly
      2026-09-22 (browser user-agent, bare fetch 403s). ss 65AAA, 66, 67,
      68, 69, 423, and Schedule 4 Part 7 (cl 1-8) reviewed in full for
      Task 22's scoped contract; see specification.md's "Proposed Task 22
      scoped calculation contract" section for what each provision
      supports. Schedule 3 cl 8's exact text was not independently
      re-fetched -- only its existence and cross-reference to "WFF tax
      credit" were confirmed. Recheck the operative version for every
      later modelled date.
      PR 24 review finding -- this is a single-session, single-party
      verification -- re-verified reproducible on a second, independent
      fetch (same day, same method, byte-identical body content aside
      from CSRF/timestamp noise) before this PR's response, but that is
      still the same author re-checking their own earlier read, not an
      independent party's read. A fresh-context reviewer must
      independently re-fetch and confirm the s 423(3) and Schedule 4
      Part 7 cl 1-6 quotes below before either finding is treated as
      confirmed rather than author-asserted. Working method -- `curl -s -A
      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
      (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -L
      "https://www.legislation.govt.nz/act/public/2018/0032/latest/whole.html"`
      -- a bare fetch (no user-agent, or a non-browser
      user-agent) 403s on this site; this is the same access pattern the
      project already established for the Income Tax Act 2007 during
      WFF's Task 10/17 work.
    task_24_1_independent_check: Independently fetched both the official
      point-in-time Act version operative on the 2026-06-01 modelled date
      (Schedule 4 in the 2026-03-11 version; the site also identifies the
      2026-04-01 version) and the latest consolidation on 2026-09-23, using the
      recorded browser user-agent method. Schedule 4 Part 7 clauses 1-3 state
      the twelve weekly caps exactly as populated in policy.yaml
      ($305/$220/$160/$120,
      $235/$155/$105/$80, and $165/$105/$80/$70), the 70% subsidy, and the
      25%-of-base-rate rent/board entry threshold. Section 423(3) still states
      $1 weekly income for every $100 of cash assets over $5,400 for a person
      in a relationship or single person with dependent children, and over
      $2,700 for any other person. No discrepancy found across the 17 values
      sourced to this Act entry (12 caps, entry fraction, 2 thresholds, step,
      and amount per step).
  - id: as-social-security-regulations
    kind: regulations
    title: Social Security Regulations 2018
    url: https://www.legislation.govt.nz/regulation/public/2018/0202/latest/
    covers: Asset requirement, income thresholds, and income-based reductions.
    task_26a_check:
      checked_on: 2026-09-24
      versions_checked: [2026-03-02, 2026-09-04]
      audit_version_url: https://www.legislation.govt.nz/secondary-legislation/pco-drafted/2018/202/en/2026-03-02/
      locator: Regulations 17(1)-(2), 18(3)(a)-(c), 19
      finding: Base-rate construction depends on benefit and relationship
        circumstances, including a statutory maximum family-tax-credit
        term for specified parents. The non-beneficiary income level is
        household-dependent. Regulation 19 governs final AS rounding;
        no rule authorising inversion of rounded table thresholds into
        statutory base rates was established in these provisions.
      limitation: The entry-threshold precision question remains unresolved;
        see docs/research/task_26a_as_rate_audit.md. DEC-001 addresses a
        different issue, rounding the income excess.
    task_22_check: Official "latest" consolidated text checked directly
      2026-09-22 (browser user-agent, same method as the Act entry above;
      this URL redirects to
      /secondary-legislation/pco-drafted/2018/202/en/latest/). rr 15, 16,
      17(reference only), 18, and 19 reviewed in full. r 18(2)'s
      income-excess rounding is confirmed genuinely silent (no "complete
      dollar" language, unlike WFF's MD 13(3)(a)) -- this is the escalated
      ambiguity in specification.md, not resolved here. r 19 confirmed to
      govern only the final accommodation-supplement amount, not any
      intermediate step. PR 24 review finding -- also re-verified
      reproducible on a second, independent fetch before this PR's
      response -- same single-session-author caveat as the Act entry
      above applies; a fresh-context reviewer should independently
      re-confirm r 18(2)'s exact wording, not take this citation on trust.
    task_24_1_independent_check: Independently fetched the official 2026-03-02
      point-in-time Regulations version operative on the 2026-06-01 modelled
      date, and the latest consolidation, on 2026-09-23 using the recorded
      browser user-agent method. Regulation 15(1) states $16,200 for a person in a
      relationship or single person with dependent children and $8,100 in any
      other case. Regulation 18(2) still states a reduction of 25 cents for
      every $1 of relevant weekly income above the subclause (3) income level,
      with no intermediate-rounding instruction. No discrepancy found across
      the 3 values sourced to this Regulations entry (2 ceilings and reduction
      rate).
