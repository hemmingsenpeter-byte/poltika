review_notes:
  - Verify each rule against the legislation version effective on the modelled date.
  - Separate the 2026-03-02 qualifying-cost change and 2027-04-01 homeowner change.
  - Check the beneficiary and pension tables against the modelled household type; pension income limits also use Schedule 5.
  - Resolve the fractional-income discrepancy between the general worksheet and student-partner example before implementation.
  - MSD excludes IRD-paid WFF credits from non-beneficiary chargeable income; verify the MSD-paid route separately.
  - Do not infer an address's area from a suburb name; MSD uses Statistical Area Units.
  - >-
    Task 24.1 benchmark search, 2026-09-23: independently checked
    as-msd-rent-board-examples, as-msd-qualifying-costs,
    as-msd-income-example, as-msd-student-partner-example, and
    as-msd-income-method, then searched MSD's official MAP and publication
    domains for another Accommodation Supplement income-reduction example.
    The ordinary income example and the additional overseas-payment example
    both use an integral $57.00 excess; rent/board and qualifying-cost examples
    do not exercise r 18(2). No second published fractional-excess example or
    direct MSD confirmation was found. DEC-001 therefore remains medium
    confidence and its convention is not promoted to an official numeric
    benchmark. The additional example is catalogued as
    as-msd-overseas-examples.
