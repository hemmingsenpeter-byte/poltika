# Fact catalogue (ADR-0016, v0.3 Task 1b.1). One entry per fact the
# Accommodation Supplement engine can report in `missing_facts`. Not a
# statutory file. Wording is drafted from the engine's field definitions and
# specification.md, and awaits GPT/Codex wording review.
schema_version: "0.1"
policy_id: accommodation_supplement
wording_status: drafted
facts:
  - id: household_eligibility
    scope: accommodation_supplement
    rule: AS-01
    question: >-
      Has it been verified that no social-housing, other-funding or
      discretionary exclusion applies to the household this week?
    kind: fact_status
    answers: {verified: "Yes, verified", excluded: "No, an exclusion applies"}
  - id: claimant_category
    scope: accommodation_supplement
    rule: AS-08
    question: Which of these describes the claimant's benefit status this week?
    kind: enum
    values:
      jobseeker_support: "Jobseeker Support"
      sole_parent_support: "Sole Parent Support"
      supported_living_payment: "Supported Living Payment"
      non_beneficiary: "Not on a main benefit"
      pension_or_veterans: "NZ Super or Veteran's Pension (not modelled)"
      mixed_benefit_couple: "A mixed-benefit couple (not modelled)"
  - id: tenure_type
    scope: accommodation_supplement
    rule: AS-02
    question: Does the household rent (or pay board), or own its home?
    kind: enum
    values:
      rent_contributions_or_board: "Rents or pays board"
      homeowner: "Owns the home"
  - id: partner_status
    scope: accommodation_supplement
    rule: AS-09
    question: What is the claimant's partner situation for this week?
    kind: enum
    values:
      single: "Single"
      ordinary_couple: "A couple"
      joint_tenancy: "A couple in a joint tenancy"
      community_spouse_or_partner: "A community spouse or partner (not modelled)"
  - id: statistical_area_unit
    scope: accommodation_supplement
    rule: AS-05
    question: >-
      Which Accommodation Supplement area is the home in, from its verified
      Statistical Area Unit (not a suburb or city name)?
    kind: enum
    values: {area1: "Area 1", area2: "Area 2", area3: "Area 3", area4: "Area 4"}
  - id: weekly_accommodation_costs
    scope: accommodation_supplement
    rule: AS-03
    question: What are the household's weekly qualifying accommodation costs?
    kind: money
    unit: NZD per week
  - id: dependent_children_count
    scope: accommodation_supplement
    rule: AS-04
    question: How many dependent children are in the household this week?
    kind: count
  - id: cash_assets
    scope: accommodation_supplement
    rule: AS-06
    question: What are the claimant's (and any partner's) cash assets?
    kind: money
    unit: NZD
  - id: weekly_income
    scope: accommodation_supplement
    rule: AS-07
    question: >-
      What is the claimant's and any partner's combined weekly chargeable
      income?
    kind: money
    unit: NZD per week
  - id: ordinary_rate_status
    scope: accommodation_supplement
    rule: AS-04
    question: >-
      Does the ordinary published rate row apply for the whole week (no
      protected, mixed-benefit, special-care or other unrepresented subtype)?
    kind: fact_status
    answers: {verified: "Yes, the ordinary row applies", excluded: "No, another subtype applies"}
  - id: eldest_dependent_child_under_16
    scope: accommodation_supplement
    rule: AS-04
    question: Is the eldest dependent child under 16 throughout the week?
    kind: fact_status
    answers: {verified: "Yes", excluded: "No"}
