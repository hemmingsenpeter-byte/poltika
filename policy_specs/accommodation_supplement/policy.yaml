    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 158, source_id: as-msd-rates-2026, locator: 'Rent or board entry threshold, row(s): Married, civil union or de facto couple (without children)', review_status: approved}
  - id: as_entry_threshold_non_beneficiary_couple_with_dependent_children
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 205, source_id: as-msd-rates-2026, locator: 'Rent or board entry threshold, row(s): Married, civil union or de facto couple, 1+ children', review_status: approved}
  - id: as_entry_threshold_non_beneficiary_sole_parent
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 168, source_id: as-msd-rates-2026, locator: 'Rent or board entry threshold, row(s): Sole parent, 1 child; Sole parent, 2+ children', review_status: approved}
  - id: as_entry_threshold_jobseeker_support_single_no_dependent_children
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 93, source_id: as-msd-jobseeker-rates-2026, locator: 'Rent or board entry threshold, row(s): Single, 18+ years, at home; Single, 18+ years, away from home', review_status: approved}
  - id: as_entry_threshold_jobseeker_support_couple_no_dependent_children
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 158, source_id: as-msd-jobseeker-rates-2026, locator: 'Rent or board entry threshold, row(s): Married, civil union or de facto couple ( without children)', review_status: approved}
  - id: as_entry_threshold_jobseeker_support_couple_with_dependent_children
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 205, source_id: as-msd-jobseeker-rates-2026, locator: 'Rent or board entry threshold, row(s): Married, civil union or de facto couple ( with children)', review_status: approved}
  - id: as_entry_threshold_jobseeker_support_sole_parent
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 168, source_id: as-msd-jobseeker-rates-2026, locator: 'Rent or board entry threshold, row(s): Sole parent, 1 child; Sole parent, 2+ children', review_status: approved}
  - id: as_entry_threshold_sole_parent_support_sole_parent
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 168, source_id: as-msd-sole-parent-rates-2026, locator: 'Rent or board entry threshold, row(s): Sole parent, 1 child; Sole parent, 2+ children', review_status: approved}
  - id: as_entry_threshold_supported_living_payment_single_no_dependent_children
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 106, source_id: as-msd-supported-living-rates-2026, locator: 'Rent or board entry threshold, row(s): Single, 16+ years', review_status: approved}
  - id: as_entry_threshold_supported_living_payment_couple_no_dependent_children
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 180, source_id: as-msd-supported-living-rates-2026, locator: 'Rent or board entry threshold, row(s): Married, civil union or de facto couple ( without children)', review_status: approved}
  - id: as_entry_threshold_supported_living_payment_couple_with_dependent_children
    value_type: money
