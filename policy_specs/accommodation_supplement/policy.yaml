# Task 22 approved scoped specification (Pete, 22 September 2026). See
# specification.md's "Proposed Task 22 scoped calculation contract" section
# and "Task 22 acceptance" note for the full rationale, DEC-001 (the r 18(2)
# rounding decision). Approval covers the scoped v0.1 domain and calculation
# sequence. The dated MSD table values (entry thresholds, income levels) were
# added by the Task 26a repair (DEC-002, policy 0.1.1) and checked against the
# official tables at 1 April 2026 in the Task 34.3 review. Policy 0.1.2
# (26 September 2026, ADR-0014): verified $0 accommodation costs (DEC-005)
# and cash assets over the r 15 ceiling with no specified lump sum
# (DEC-004) are `ineligible` $0, and the `specified_lump_sum_status` input
# was added.
schema_version: "0.1"
policy_id: accommodation_supplement
policy_version: "0.1.2"
status: approved
reference_period:
  from: 2026-03-02
  to: 2027-04-01
source_catalog: sources.yaml

assessment:
  unit: accommodation_supplement_claim
  roles: [claimant, partner]
  membership_period: assessment_week
  supported_domain: single_claimant_or_ordinary_couple_rent_or_board_tenure_supported_benefit_categories
  source_rule_ids: [AS-01, AS-02, AS-04, AS-09]
  unsupported:
    - social_housing_exclusion
    - other_funding_exclusion_including_disability_care
    - student_allowance_exclusion_or_exception
    - joint_tenancy
    - community_spouse_or_partner
    - pension_or_veterans_claimant_category
    - mixed_benefit_couple
    - s69_discretionary_refusal_reduction_cancellation
    - homeowner_tenure
    - unverified_statistical_area_unit
    - asset_limit_increased_by_specified_lump_sum
    - exempt_cash_asset_unverified
    - accommodation_income_or_business_use_qualifying_costs

inputs:
  - id: household_eligibility_facts
    owner: assessment_unit
    type: documented_eligibility_facts
    period: assessment_week
    source_rule_ids: [AS-01]
    missing_outcome: needs_review
    note: Social housing exclusion (s 66); other-funding exclusion (s 67), covering each of its paragraphs this branch cares about -- the s 67(b) Student Allowance exclusion/exception (PR #24 review finding -- distinct from "other funding" in specification.md's own qualification table and named separately in assessment.unsupported below, so it needs its own explicit mention here, not an implicit "s 67" umbrella) and the s 67(d) disability/care branch this Task 2 map did not originally name; and s 69 discretionary refusal/reduction/cancellation grounds. Absence of an exclusion cannot be inferred from a missing field.
  - id: claimant_category
    owner: claimant
    type: verified_benefit_or_non_beneficiary_category
    period: assessment_week
    source_rule_ids: [AS-04, AS-08]
    missing_outcome: needs_review
    note: Jobseeker Support, Sole Parent Support, Supported Living Payment, or non-beneficiary are the v0.1 supported categories (r 18's ordinary income-reduction route). NZ Superannuation/Veteran's Pension (a separate s 67(e)/Schedule 5 income-limit route) and mixed-benefit couples are unsupported.
  - id: tenure_type
    owner: claimant
    type: verified_tenure_type
    period: assessment_week
    source_rule_ids: [AS-02, AS-04]
    missing_outcome: needs_review
    note: rent_contributions_or_board is the v0.1 supported tenure (Schedule 4 Part 7 cl 1-3, 25%-of-base-rate entry threshold). Homeowner tenure (cl 4-6, 30%-of-base-rate threshold) is unsupported.
  - id: weekly_accommodation_costs
    owner: claimant
    type: verified_amount
    unit: NZD_per_week
    period: assessment_week
    source_rule_ids: [AS-03]
    missing_outcome: needs_review
    note: The plain-case weekly qualifying accommodation costs (Schedule 4 Part 7 cl 7, b = c = d = f = 0) -- no accommodation income from boarders/sub-letting, no business-use deduction. A claimant with any of those is unsupported in this branch.
  - id: partner_status
    owner: assessment_unit
    type: verified_partner_status
    period: assessment_week
    source_rule_ids: [AS-09]
    missing_outcome: needs_review
    note: single or ordinary_couple only. Joint tenancy (s 68) and community spouse/partner (Schedule 4 Part 7 cl 6A) are separate, unsupported branches even though they are also "couple" cases.
  - id: dependent_children_count
    owner: assessment_unit
    type: verified_count
    period: assessment_week
    source_rule_ids: [AS-04]
    missing_outcome: needs_review
    note: Selects two separate household groupings (Task 26a repair, DEC-002) -- the Schedule 4 Part 7 cl 1-3 cap category (1+ dependent children in a relationship or a sole parent with 2+; no dependent children in a relationship or a sole parent with 1; any other person) and the published-table rate row (single, sole parent, couple without children, couple with children).
  - id: ordinary_rate_status
    owner: assessment_unit
    type: verified_fact_status
    period: assessment_week
    source_rule_ids: [AS-04]
    missing_outcome: needs_review
    note: Task 26a repair (DEC-002). verified means the ordinary published rate row applies for the whole week -- no protected Jobseeker woman-alone rate, mixed-benefit rate, special care/residential rate or other unrepresented subtype; for a single beneficiary under 25 it includes applicability of r 17(2)(a)'s age-25 rate. A couple with a non-qualified partner and dependent children uses the ordinary couple-with-children row (MSD publishes identical values for it); a non-qualified-partner couple without children has no published row and is an unrepresented subtype, so excluded. excluded (a known subtype outside this branch) is unsupported. General household eligibility does not imply it.
  - id: eldest_dependent_child_under_16
    owner: assessment_unit
    type: verified_fact_status
    period: assessment_week
    required_for: accommodation_supplement
    source_rule_ids: [AS-04]
    missing_outcome: needs_review
    note: Task 26a repair (DEC-002). Parent rate rows only (one or more dependent children) -- the eldest qualifying dependent child is under 16 throughout the week. excluded is unsupported as a conservative scope restriction, not a finding of no entitlement. Not consulted when the count is zero; never inferred from a count or a WFF child list.
  - id: statistical_area_unit
    owner: claimant
    type: verified_area_1_to_4_classification
    period: assessment_week
    source_rule_ids: [AS-05]
    missing_outcome: needs_review
    note: Must be a verified Statistical Area Unit resolved to Area 1-4 (as-msd-areas). Never inferred from a suburb/city name; never silently defaulted to Area 4.
  - id: cash_assets
    owner: assessment_unit
    type: verified_amount
    unit: NZD
    period: assessment_week
    source_rule_ids: [AS-06]
    missing_outcome: needs_review
    note: Includes partner's assets per s 69(2), subject to s 69(2A)/(2B) exceptions (community spouse/partner cases -- unsupported in this branch). Any exempt cash asset (r 16, Schedule 8 Part 1) must be verified, not assumed absent.
  - id: specified_lump_sum_status
    owner: assessment_unit
    type: verified_fact_status
    period: assessment_week
    source_rule_ids: [AS-06]
    missing_outcome: needs_review
    note: DEC-004. verified means verified that no ACC impairment lump sum (Accident Compensation Act 2001) and no Independence Allowance lump sum (Accident Insurance Act 1998) was received by the claimant, partner or a dependent child in the 12 months up to the assessment week -- MSD raises the r 15 limit by such a lump sum for 12 months (s 69(3), (5); as-msd-lump-sum-impairment, as-msd-lump-sum-independence-allowance). Consulted only when cash assets exceed the r 15 ceiling. excluded (a lump sum was received) is unsupported -- the increased limit is not modelled; unknown is needs_review.
  - id: weekly_income
    owner: assessment_unit
    type: verified_amount
    unit: NZD_per_week
    period: assessment_week
    required_for: accommodation_supplement
    source_rule_ids: [AS-07]
    missing_outcome: needs_review
    note: Combined weekly income of claimant and partner (r 18(2A)), before the s 423(3) asset-imputation addition. Required only for the non-beneficiary income-reduction step (r 18); other supported claimant categories may have a different or no separate AS income test (AS-08).

# Task 23 (23 September 2026, per Pete's decision): populated using the
# narrow ParameterUnit extension (NZD, NZD_per_week, fraction -- see that
# enum's docstring) added for exactly this purpose. Every value below was
# independently verified directly against the Social Security Act 2018 or
# Social Security Regulations 2018 official text during Task 22 (see
# specification.md's "Approved Task 22 scoped calculation contract"
# section) -- review_status: approved reflects that direct statutory
# verification, not a dated MSD table (none of these values come from one).
#
# The published rent/board entry thresholds
# (as_entry_threshold_<claimant_category>_<rate_household>) and the
# non-beneficiary income levels (as_income_level_non_beneficiary_<rate_
# household>) are declared further below for the supported rows only (Task
# 26a.2, DEC-002, policy 0.1.1). An unsupported row has no declared id, and
# the calculator resolves an undeclared id to needs_review rather than a
# placeholder value. The Task 25/26 as_base_rate_* ids were a SPEC_ERROR
# (PR #46) and are not aliases or fallbacks.
parameters:
  # Schedule 4 Part 7 cl 1-3 area caps, rent/contributions/board tenure.
  # Household category selects which set of four; Area 1-4 selects within
  # a set. Confirmed 2026-09-22/23 directly against the Act text
  # (specification.md, calculation sequence step 4).
  - id: area_cap_with_dependent_children_area1
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 305, source_id: as-social-security-act, locator: 'Schedule 4 Part 7 cl 1(a)', review_status: approved}
  - id: area_cap_with_dependent_children_area2
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 220, source_id: as-social-security-act, locator: 'Schedule 4 Part 7 cl 1(b)', review_status: approved}
  - id: area_cap_with_dependent_children_area3
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 160, source_id: as-social-security-act, locator: 'Schedule 4 Part 7 cl 1(c)', review_status: approved}
  - id: area_cap_with_dependent_children_area4
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 120, source_id: as-social-security-act, locator: 'Schedule 4 Part 7 cl 1(d)', review_status: approved}
  - id: area_cap_no_dependent_children_couple_or_sole_parent_one_child_area1
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 235, source_id: as-social-security-act, locator: 'Schedule 4 Part 7 cl 2(a)', review_status: approved}
  - id: area_cap_no_dependent_children_couple_or_sole_parent_one_child_area2
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 155, source_id: as-social-security-act, locator: 'Schedule 4 Part 7 cl 2(b)', review_status: approved}
  - id: area_cap_no_dependent_children_couple_or_sole_parent_one_child_area3
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 105, source_id: as-social-security-act, locator: 'Schedule 4 Part 7 cl 2(c)', review_status: approved}
  - id: area_cap_no_dependent_children_couple_or_sole_parent_one_child_area4
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 80, source_id: as-social-security-act, locator: 'Schedule 4 Part 7 cl 2(d)', review_status: approved}
  - id: area_cap_single_no_dependent_children_area1
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 165, source_id: as-social-security-act, locator: 'Schedule 4 Part 7 cl 3(a)', review_status: approved}
  - id: area_cap_single_no_dependent_children_area2
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 105, source_id: as-social-security-act, locator: 'Schedule 4 Part 7 cl 3(b)', review_status: approved}
  - id: area_cap_single_no_dependent_children_area3
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 80, source_id: as-social-security-act, locator: 'Schedule 4 Part 7 cl 3(c)', review_status: approved}
  - id: area_cap_single_no_dependent_children_area4
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 70, source_id: as-social-security-act, locator: 'Schedule 4 Part 7 cl 3(d)', review_status: approved}

  # Subsidy rate: 70% of the positive excess of accommodation costs over the
  # entry threshold, before the area cap (Schedule 4 Part 7 cl 1-3). Was a
  # literal in the calculator until Task 34.3 F3; declared here so it is
  # sourced, effective-dated and named in the provenance trace.
  - id: rent_board_subsidy_rate
    value_type: fraction
    unit: fraction
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 0.7, source_id: as-social-security-act, locator: 'Schedule 4 Part 7 cl 1-3', review_status: approved}

  # Entry threshold: 25% of the claimant's base rate, rent/board tenure
  # (Schedule 4 Part 7 cl 1-3). The homeowner threshold (30%, cl 4-6) is
  # not included -- homeowner tenure is unsupported in this v0.1 domain.
  # RETAINED BUT UNUSED (DEC-002): the calculator subtracts MSD's published
  # entry thresholds directly and must never multiply a base rate by this
  # fraction. Kept as the statutory record the published thresholds derive
  # from, and still week-coverage checked (Task 34.3 F3).
  - id: entry_threshold_rent_board_fraction
    value_type: fraction
    unit: fraction
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 0.25, source_id: as-social-security-act, locator: 'Schedule 4 Part 7 cl 1-3', review_status: approved}

  # r 15 assets requirement -- a gate amount (eligibility ceiling), not a
  # rate. Confirmed directly against the Regulations text.
  - id: asset_ceiling_relationship_or_dependent_children
    value_type: money
    unit: NZD
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 16200, source_id: as-social-security-regulations, locator: 'r 15(1)(a)', review_status: approved}
  - id: asset_ceiling_other
    value_type: money
    unit: NZD
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 8100, source_id: as-social-security-regulations, locator: 'r 15(1)(b)', review_status: approved}

  # s 423(3) asset-to-income imputation: $1/week per complete $100 of cash
  # assets over the threshold. Modelled as three parameters (threshold,
  # step size, per-step amount) rather than baking "$100" into a rate
  # unit -- the calculator applies floor(excess / step_size) * per_step,
  # per specification.md's "complete hundreds" reading.
  - id: asset_imputation_threshold_relationship_or_dependent_children
    value_type: money
    unit: NZD
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 5400, source_id: as-social-security-act, locator: 's 423(3)(a)', review_status: approved}
  - id: asset_imputation_threshold_other
    value_type: money
    unit: NZD
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 2700, source_id: as-social-security-act, locator: 's 423(3)(b)', review_status: approved}
  - id: asset_imputation_step_size
    value_type: money
    unit: NZD
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 100, source_id: as-social-security-act, locator: 's 423(3)', review_status: approved}
  - id: asset_imputation_amount_per_step
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 1, source_id: as-social-security-act, locator: 's 423(3)', review_status: approved}

  # r 18(2): 25 cents per $1 of relevant weekly income in excess of the
  # r 18(3) income level. DEC-001 decided the excess is NOT floored before
  # this rate applies -- that is calculator logic (specification.md step
  # 5), not encoded in this parameter's value or unit.
  - id: income_reduction_rate
    value_type: fraction
    unit: fraction
    values:
      - {effective_from: 2026-03-02, effective_to: 2027-04-01, value: 0.25, source_id: as-social-security-regulations, locator: 'r 18(2)', review_status: approved}

  # Task 26a.2 (24 September 2026): published MSD rent/board entry thresholds
  # and non-beneficiary income levels, per DEC-002 and the Task 26a selector
  # repair. Values generated from the fetched tables (all labelled "at 1 April
  # 2026"), not re-typed. The protected Jobseeker woman-alone row has no id
  # (ordinary_rate_status excludes it). Non-qualified-partner couple rows
  # with children publish the same values as the ordinary couple-with-
  # children row and share its id; without children no row is published,
  # so ordinary_rate_status excludes them (see that input's note). No value
  # exists before 1 April 2026, so March weeks stay gated.
  - id: as_entry_threshold_non_beneficiary_single_no_dependent_children
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 93, source_id: as-msd-rates-2026, locator: 'Rent or board entry threshold, row(s): Single, 16+ years', review_status: approved}
