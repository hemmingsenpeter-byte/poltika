    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 693, source_id: as-msd-income-2026, locator: 'Income threshold column (same in Areas 1-4), row(s): Single, 16+ years', review_status: approved}
  - id: as_income_level_non_beneficiary_couple_no_dependent_children
    value_type: money
    unit: NZD_per_week
    values:
