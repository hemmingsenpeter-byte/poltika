  - id: as_entry_threshold_supported_living_payment_sole_parent
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 184, source_id: as-msd-supported-living-rates-2026, locator: 'Rent or board entry threshold, row(s): Sole parent, 1 child; Sole parent, 2+ children', review_status: approved}
  - id: as_income_level_non_beneficiary_single_no_dependent_children
    value_type: money
