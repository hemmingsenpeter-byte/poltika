    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 1117, source_id: as-msd-income-2026, locator: 'Income threshold column (same in Areas 1-4), row(s): Married, civil union or de facto couple, 1+ children', review_status: approved}
  - id: as_income_level_non_beneficiary_sole_parent
    value_type: money
    unit: NZD_per_week
    values:
      - {effective_from: 2026-04-01, effective_to: 2027-04-01, value: 906, source_id: as-msd-income-2026, locator: 'Income threshold column (same in Areas 1-4), row(s): Sole parent, 1 child; Sole parent, 2+ children', review_status: approved}

components:
  - id: accommodation_supplement
    source_rule_ids: [AS-01, AS-02, AS-03, AS-04, AS-05, AS-06, AS-07, AS-08, AS-09]
    output_id: accommodation_supplement_weekly
    validation_checks:
      - social_housing_exclusion
      - other_funding_exclusion_including_disability_care
      - student_allowance_exclusion_or_exception
      - joint_tenancy
      - community_spouse_or_partner
      - pension_or_veterans_claimant_category
      - mixed_benefit_couple
      - s69_discretionary_refusal_reduction_cancellation
      - homeowner_tenure
      - unverified_statistical_area_unit
      - asset_ceiling_exceeded
      - exempt_cash_asset_unverified
      - accommodation_income_or_business_use_qualifying_costs
      # income_excess_rounding_convention_undecided removed: resolved by
      # DEC-001 (22 September 2026) -- apply 25% to the exact, unrounded
      # income excess. No longer a runtime decision gate; it's an
      # ordinary calculation-sequence rule now (specification.md step 5).
      # DEC-001's medium-confidence/not-yet-corroborated caveat is a Task
      # 24 benchmark-promotion concern, not a calculator-input trigger.

outputs:
  unit: NZD_per_week
  components: [accommodation_supplement_weekly]
  # `ineligible` (ADR-0014; DEC-004, DEC-005): an evidenced eligibility-test
  # failure, reported with value 0.
  outcome_states: [calculated, ineligible, unsupported, needs_review]
  note: Weekly entitlement, not an annual or fortnightly figure. Rounded up to the complete dollar (r 19) only at the final step -- see specification.md for why intermediate steps must not also round.
