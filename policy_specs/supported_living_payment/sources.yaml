- id: supported-living-payment-social-security-act-20260926
  kind: legislation
  title: Social Security Act 2018 — current SLP specification check
  url: https://www.legislation.govt.nz/act/public/2018/32/en/2026-09-26/
  version_as_at: '2026-09-26'
  checked_on: 2026-10-13
  locator: >-
    ss 16-18, 34-42, 349-351; Schedule 2 Income Test 1 and income;
    Schedule 3 cls 2-14; Schedule 4 Part 3 cl 1(a)-(h) and trailing paragraph.
  finding: >-
    Latest-version header confirmed. Restricted-capacity s 34 requires age 16+ and residence;
    MSD decides permanence/severity under s 35. Ordinary single no-children rates distinguish
    under-18 cl 1(a) 355.87 from other-single cl 1(b) 424.60 NZD/week, both Test 1. Test 1 is
    30 cents over 160 up to 250 and 70 cents over 250; the s 34 own-effort disregard is mandatory
    up to 20/week. Sections 349-351 supply tax/gross-up authority, not a complete numeric method.
  comparison_note: >-
    Independently compared the official 4 September and 26 September HTML text. The sole
    substantive change is Schedule 2 CYPFA order or agreement para (a), adding Oranga Tamariki
    Act s 283(na), with amendment/history notes. Scoped SLP provisions are unchanged.
  retrieval_note: >-
    Browser retrieval of dated legislation failed. Official latest HTML retrieved directly with
    browser user agent by the parallel source worker, independently inspected and re-extracted
    for this check; latest header and dated download identity both state 26 September 2026.
  limitation: >-
    Documentary values only, not approved parameters. No complete eligibility or exceptional-state
    audit, gross-up method, fractional-income rule, exact cut-out or benefit rounding is approved.
- id: supported-living-payment-msd-personal-earnings
  kind: agency_guidance_and_examples
  title: MSD MAP — Supported Living Payment personal earnings exemptions
  url: https://map.workandincome.govt.nz/map/income-support/main-benefits/supported-living-payment/personal-earnings-exemptions-01.html
  checked_on: 2026-10-13
  locator: Personal earnings definition; disregard paragraphs; Example 1; Schedule 4 Part 3 cross-reference.
  finding: >-
    Distinguishes own-effort income from other classes and carer/blindness rules. Example 1 takes
    400 gross earnings less 20 personal exemption, then shows 27 plus 91 equals 118 income-test
    reduction. Corroborates the statutory disregard and Test 1 ordering.
  limitation: >-
    Live MAP has no version date. Whole-dollar reduction example only; no gross-entitlement,
    fractional-income or payment-rounding benchmark. Carer/blindness remain unsupported.
- id: supported-living-payment-msd-weekly-income-examples
  kind: agency_guidance_and_examples
  title: MSD MAP — Supported Living Payment weekly income example
  url: https://map.workandincome.govt.nz/map/income-support/main-benefits/supported-living-payment/weekly-income-example-01.html
  checked_on: 2026-10-13
  locator: Example 1 personal earnings exemption; Example 2 no personal earnings exemption.
  finding: >-
    Example 1 uses 450 gross earnings, 20 exemption and reduction 27 plus 126 equals 153.
    Example 2 uses 520 without personal exemption and reduction 27 plus 189 equals 216.
    These are published reduction benchmark candidates only.
  limitation: >-
    Current undated guidance. Example 2 is not proof that an ordinary s 34 claimant can ignore
    the mandatory own-effort disregard. Neither example supplies gross benefit or precision.
- id: supported-living-payment-msd-single-adult-deductions
  kind: agency_guidance
  title: MSD — Supported Living Payment single 18+ deduction tables
  url: https://www.workandincome.govt.nz/on-a-benefit/tell-us/income/deduction-tables/supported-living-payment
  page_updated_on: '2026-06-12'
  checked_on: 2026-10-13
  locator: Your deductions; calculation steps 1-3; estimate warning; after-tax deduction column heading.
  finding: >-
    Separates income before tax from deduction from benefit payment after tax; sets out the Test 1
    bands and notes the additional personal-earnings allowance. The deduction table is an estimate.
  limitation: >-
    No precise gross-up or fractional-money algorithm. Do not subtract these net-payment
    deductions from a published gross maximum or adopt the displayed cut-out as exact.
- id: supported-living-payment-msd-cutouts-2026
  kind: agency_rates
  title: MSD MAP — Supported Living Payment cut-out points at 1 April 2026
  url: https://map.workandincome.govt.nz/map/deskfile/main-benefits-cut-out-points/supported-living-payment-cut-out-points-current.html
  published_rate_date: '2026-04-01'
  checked_on: 2026-10-13
  locator: Net-M/weekly-rounding introduction; single 18+ row.
  finding: >-
    Net weekly benefit is after tax at M. Weekly income cut-outs are rounded to the nearest dollar;
    page directs annual-income comparison near the displayed weekly boundary.
  limitation: >-
    Display rounding only. No exact weekly zero threshold, rounding rule for entitlement,
    continued payment status or approved gross-benefit benchmark for the proposed week.
- id: supported-living-payment-msd-taxation
  kind: agency_guidance
  title: MSD MAP — Supported Living Payment taxation
  url: https://map.workandincome.govt.nz/map/income-support/main-benefits/supported-living-payment/changes-and-reviews-supported-living-payment/taxation-01.html
  checked_on: 2026-10-13
  locator: Opening taxable-benefit/net-payment paragraph; Legislation, tax on benefits ss 349-352.
  finding: >-
    Supported Living Payment is taxable; MSD makes net payments after tax and passes tax to IRD.
    The source distinguishes net payment from taxable/gross benefit concepts.
  retrieval_note: Official HTML retrieved directly with browser user agent after browser cache miss.
  limitation: Current undated guidance; tax code and numerical gross-up/payment precision remain unresolved.
- id: supported-living-payment-income-tax-act-rd11
  kind: legislation
  title: Income Tax Act 2007 — main-benefit tax determination
  url: https://www.legislation.govt.nz/act/public/2007/97/en/2026-09-04/sections/DLM1519963/
  version_as_at: '2026-09-04'
  checked_on: 2026-10-13
  locator: RD 11(3), especially (a), overriding RD 10(1).
  finding: >-
    Main-benefit PAYE tax must be determined by the Commissioner in consultation with the
    administering department's chief executive. Ordinary salary/wage tax is not automatically
    the SLP tax method; the source verifies authority, not the missing numerical determination.
  retrieval_note: >-
    Dated section retrieved directly from official HTML with browser user agent after browser
    failure; confirmed header as at 4 September 2026 and section text, not table of contents alone.
  limitation: >-
    No Commissioner/MSD numerical determination, gross-up or rounding algorithm was located.
    No PAYE, annual tax, gross entitlement or parameter approval is created.

