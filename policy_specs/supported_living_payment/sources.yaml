  finding: Official overview distinguishes the restricted-capacity/blindness route from the non-partner
    full-time-carer route and identifies separate evidence, age and income considerations.
  limitation: Simplified current public guidance. No historical applicability, MSD determination, or complete
    eligibility audit is established.
