  source_checks:
    - source_id: supported-living-payment-social-security-regulations
      locator: rr 10-11, 205(1)-(3); Schedule 6 item 1; Schedule 8 Part 25 cl 44.
      finding: >-
        Version as at 4 September 2026 remains the latest version on retrieval. SLP's default is
        52 weeks; a weekly basis needs an MSD/person agreement that either can terminate by notice.
        Two-year clinical period and prescribed health practitioners remain asserted MSD matters.
        The severe-disablement income exemption is discretionary and separate from restricted capacity.
    - source_id: supported-living-payment-rates-order-2026
      locator: cls 2, 4-5; Schedule 1 Part 1, Schedule 4 Part 3 cl 1(a)-(b) entries.
      finding: >-
        From 1 April 2026 the scheduled under-18 amount is 355.87 and ordinary other-single amount
        is 424.60 NZD/week. These are documentary unapproved observations; the Order does not supply
        the published 489.21 adult gross amount or a general tax/rounding conversion method.
    - source_id: supported-living-payment-msd-overview
      locator: Who can get it; health-condition route; medical evidence; circumstances/income review.
      finding: >-
        The 24 July 2026 public-page update and current route/evidence wording were rechecked.
        Restricted-capacity eligibility is not computed from age, diagnosis or hours alone.
    - source_id: supported-living-payment-msd-income
      locator: Annual income charge; Weekly income charge; Income exemptions; Overseas pensions.
      finding: >-
        Current MAP corroborates separate annual/weekly bases and weekly Test 1 bands at 160 and
        250, with 30/70 cents per dollar. These do not establish an agreement or approve parameters.
    - source_id: supported-living-payment-msd-rates-2026
      locator: Supported Living Payment, without-children single 18+ and single 16-17 rows.
      finding: >-
        Table dated 1 April 2026, page updated 13 July 2026. Adult single net M 424.60 and gross
        489.21 are distinct; under-18 net M 355.87 and gross 405.90 form a separate category.
        Observations only; no value approval or gross-up/precision convention follows.
    - source_id: supported-living-payment-future-jobseeker-as-amendment-2026
      locator: s 2(1)-(2); ss 11-12 and Schedule 1 for shared definitions/income; Part 2.
      finding: >-
        As enacted 3 September 2026: commencement remains 2 November 2026 for Part 1 and
        1 April 2027 for Part 2. Outside the proposed week; no post-commencement SLP coverage adopted.
