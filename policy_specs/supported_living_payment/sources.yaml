sources:
- id: supported-living-payment-social-security-act
  kind: legislation
  title: Social Security Act 2018
  url: https://www.legislation.govt.nz/act/public/2018/32/en/2026-09-04/
  version_as_at: '2026-09-04'
  locator: ss 34-42; Schedule 4 Part 3 cls 1-8; Schedule 2 Income Tests 1-2. Also ss 8, 16-19; Schedule
    2 definitions; Schedule 3 Parts 1-3A.
  finding: Person, partner and policy-specific child status select the applicable grant and income test.
    Income definitions have express inclusions, exclusions and ordering; statutory main benefits and WFF
    credits are excluded by Schedule 3 cl 8(1)(a), (l).
  limitation: Scoped provisions only. No whole-Act, application-history, sanctions, absence, stand-down
    or historical-year audit; no numerical parameter adoption.
  checked_on: '2026-10-03'
- id: supported-living-payment-social-security-regulations
  kind: regulations
  title: Social Security Regulations 2018
  url: https://www.legislation.govt.nz/secondary-legislation/pco-drafted/2018/202/en/2026-09-04/
  version_as_at: '2026-09-04'
  locator: rr 10-11, 205; Schedule 6; rr 17-18 for the AS interaction.
  finding: Clinical evidence requirements differ by benefit route. Regulation 205 and Schedule 6 distinguish
    income assessment bases; beneficiary class also affects Accommodation Supplement.
  limitation: Income exemptions in Schedule 8 and exceptional administration routes are not exhaustively
    scoped; guidance does not approve selection of an assessment basis.
  checked_on: '2026-10-03'
- id: supported-living-payment-rates-order-2026
  kind: regulations
  title: Social Security (Rates of Benefits and Allowances) Order 2026
  url: https://www.legislation.govt.nz/secondary-legislation/pco-drafted/2026/36/en/2026-03-02B/
  version_as_at: '2026-03-02'
  version_label: As made; dated URL has B suffix.
  legal_commencement: '2026-04-01'
  locator: cls 2-5; Schedule 1 Part 1, Schedule 4 Part 3 entries.
  finding: Clause 2 establishes commencement; cl 4 applies the adjustments to benefits payable on and
    after commencement. Clause 5 and Schedule 1 amend the three benefit rate tables.
  limitation: Rates were located, not transcribed. No approved values, end date, gross/net conversion
    or rounding method is established by this source-only inventory.
  checked_on: '2026-10-03'
- id: supported-living-payment-income-tax-act-interactions
  kind: legislation
  title: Income Tax Act 2007 — main-benefit interactions
  url: https://www.legislation.govt.nz/act/public/2007/97/en/2026-09-04/
  version_as_at: '2026-09-04'
  locator: CF 1(1)(c); YA 1 main benefit; MB 1(1)(b), MB 2; MC 6(b)(i), MD 8, MD 14, ME 2, MG 4.
  finding: These main benefits are taxable income; WFF allocates main-benefit income over the paid-for
    period. Receipt has component-specific WFF eligibility and protected-month consequences; employment
    remains a separate test.
  limitation: Interaction locators only. No PAYE calculation, full-year policy coverage, MFTC result,
    protected-credit calculation or new disposable-income definition is approved.
  checked_on: '2026-10-03'
- id: supported-living-payment-ird-government-payments
  kind: agency_guidance
  title: IRD — Government payments that affect your Working for Families
  url: https://www.ird.govt.nz/working-for-families/types/government-payments
  page_updated_on: '2026-04-09'
  locator: Government-assistance table, main-benefit row; These payments are added to your family income.
  finding: The table allows possible FTC/Best Start alongside a main benefit, excludes IWTC/MFTC, and
    explains inclusion of taxable main-benefit payments in family income.
  limitation: Current guidance corroboration, not independent eligibility proof or a historical source
    version. Statutory relationship-period and protected-month tests still require review.
  checked_on: '2026-10-03'
- id: supported-living-payment-future-jobseeker-as-amendment-2026
  kind: future_amending_legislation
  title: Social Security (Jobseeker Support and Accommodation Supplement) Amendment Act 2026
  url: https://www.legislation.govt.nz/act/public/2026/54/en/latest/
  version_as_at: '2026-09-03'
  version_label: As enacted; official page says not yet in force on retrieval.
  locator: >-
    s 2(1)-(2); Part 1 ss 4-12 and Schedule 1 (SSA s 20(ca), new ss 23A-23I,
    equivalent emergency benefit, review provisions, new s 422A and Schedules 1-3);
    Part 2 ss 13-15 and Schedule 2 (SSA Schedule 4 Part 7 cls 4-6B).
  finding: >-
    Enacted future law, independently re-read 5 October 2026. From 2 November
    2026 Part 1 introduces a parental-income requirement for specified young
    JS applicants/recipients and partners, extends it to equivalent emergency
    benefit, adds review/regulation and transitional provisions, and amends
    Schedule 2 definitions and Schedule 3 parental-income calculation/deprivation
    rules (new cls 14A-14E, 16A and amended cl 17). From 1 April 2027 Part 2
    replaces AS homeowner threshold categories, retaining separate categories
    for specified people including SLP recipients and their partners; it also
    updates the community-spouse cross-reference and adds transitional provisions.
  limitation: >-
    Not operative for 3 October 2026. This is a change inventory, not an
    approved post-commencement rule, amount or graph edge. Shared definitions,
    the new Schedule 3 cl 16A benefit-reduction/cancellation power and SLP-linked
    AS categories require a fresh cross-policy review; SPS/SLP implications
    are not assumed absent. Detailed post-commencement mapping remains pending.
  checked_on: '2026-10-05'
- id: supported-living-payment-msd-overview
