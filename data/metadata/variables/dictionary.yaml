# The canonical variable dictionary (poltika.semantics.variables.DataDictionary).
# Entries record a publication's own definitions (unit, frequency, price
# base), so each is added with the dataset that feeds it (v0.2 Task 3.1),
# never from memory. These were added with the v0.2 Task 3.2 snapshots
# (27 September 2026); see docs/research/v0_2_task_3_1_calibration_tables.md.
