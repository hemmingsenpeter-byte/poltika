- id: accommodation_supplement.recipients
  meaning: Recipients of Accommodation Supplement, all ages (MSD Benefit Fact Sheets, 'Selected supplementary
    assistance - last five years', Accommodation Supplement (AS) row), in the column labelled by the quarter's
    last month. The table states no count date, so the figure is recorded for the whole labelled quarter;
    whether it is a quarter-end count is not stated. The fact sheets' notes say counts are randomly rounded
    to base 3 and that people may receive more than one supplementary assistance.
  unit: recipients
  frequency: quarterly
  price_basis: not_applicable
  measure: stock
  geography_population: New Zealand, all ages including non-beneficiaries
  valid_from: 2021-04-01
