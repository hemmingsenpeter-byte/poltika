Banner&quot;:[],&quot;PageBlocks&quot;:[{&quot;ID&quot;:&quot;445&quot;,&quot;Title&quot;:&quot;Description births and deaths&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;&lt;span class=\&quot;intro\&quot;&gt;Births and deaths releases provide statistics on the number of births and deaths of people resident in New Zealand that are registered during a given period, along with selected fertility and mortality rates. They may differ from statistics presented elsewhere that relate to all births and deaths registered in New Zealand or to births and deaths occurring during a given period.&lt;\/span&gt;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;128335&quot;,&quot;Title&quot;:&quot;Births and deaths: Year ended March 2025 \u2013 download data&quot;,&quot;ClassName&quot;:&quot;DocumentBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;BlockDocuments&quot;:[{&quot;ID&quot;:&quot;119153&quot;,&quot;ClassName&quot;:&quot;SilverStripe\\Assets\\File&quot;,&quot;Name&quot;:&quot;regional-fertility-rates-1996-2001-2006-2013-2018-2023.xlsx&quot;,&quot;FileName&quot;:&quot;regional-fertility-rates-1996-2001-2006-2013-2018-2023.xlsx&quot;,&quot;Title&quot;:&quot;Regional fertility rates: 1996, 2001, 2006, 2013, 2018, and 2023&quot;,&quot;ShowInSearch&quot;:1,&quot;ParentID&quot;:118935,&quot;OwnerID&quot;:53,&quot;DocumentLink&quot;:&quot;\/assets\/Uploads\/Births-and-deaths\/Births-and-deaths-Year-ended-March-2025\/Download-data\/regional-fertility-rates-1996-2001-2006-2013-2018-2023.xlsx&quot;,&quot;DocumentCategory&quot;:&quot;document&quot;,&quot;DocumentExtension&quot;:&quot;xlsx&quot;,&quot;DocumentFileType&quot;:&quot;Excel spreadsheet&quot;,&quot;DocumentIcon&quot;:&quot;\/_resources\/vendor\/silverstripe\/framework\/client\/images\/app_icons\/document_92.png?m=1788898508&quot;,&quot;DocumentSize&quot;:&quot;71 KB&quot;,&quot;DocumentPreviewImage&quot;:false},{&quot;ID&quot;:&quot;119150&quot;,&quot;ClassName&quot;:&quot;SilverStripe\\Assets\\File&quot;,&quot;Name&quot;:&quot;age-specific-fertility-rates-by-ethnicity-2001-2006-2013-2018-2023.xlsx&quot;,&quot;FileName&quot;:&quot;age-specific-fertility-rates-by-ethnicity-2001-2006-2013-2018-2023.xlsx&quot;,&quot;Title&quot;:&quot;Age-specific fertility rates by ethnicity: 2001, 2006, 2013, 2018, and 2023&quot;,&quot;ShowInSearch&quot;:1,&quot;ParentID&quot;:118935,&quot;OwnerID&quot;:53,&quot;DocumentLink&quot;:&quot;\/assets\/Uploads\/Births-and-deaths\/Births-and-deaths-Year-ended-March-2025\/Download-data\/age-specific-fertility-rates-by-ethnicity-2001-2006-2013-2018-2023.xlsx&quot;,&quot;DocumentCategory&quot;:&quot;document&quot;,&quot;DocumentExtension&quot;:&quot;xlsx&quot;,&quot;DocumentFileType&quot;:&quot;Excel spreadsheet&quot;,&quot;DocumentIcon&quot;:&quot;\/_resources\/vendor\/silverstripe\/framework\/client\/images\/app_icons\/document_92.png?m=1788898508&quot;,&quot;DocumentSize&quot;:&quot;61 KB&quot;,&quot;DocumentPreviewImage&quot;:false},{&quot;ID&quot;:&quot;119151&quot;,&quot;ClassName&quot;:&quot;SilverStripe\\Assets\\File&quot;,&quot;Name&quot;:&quot;monthly-death-registrations-by-ethnicity-age-and-sex-January-2010-March-2025.xlsx&quot;,&quot;FileName&quot;:&quot;monthly-death-registrations-by-ethnicity-age-and-sex-January-2010-March-2025.xlsx&quot;,&quot;Title&quot;:&quot;Monthly death registrations by ethnicity, age, and sex: January 2010\u2013March 2025&quot;,&quot;ShowInSearch&quot;:1,&quot;ParentID&quot;:118935,&quot;OwnerID&quot;:53,&quot;DocumentLink&quot;:&quot;\/assets\/Uploads\/Births-and-deaths\/Births-and-deaths-Year-ended-March-2025\/Download-data\/monthly-death-registrations-by-ethnicity-age-and-sex-January-2010-March-2025.xlsx&quot;,&quot;DocumentCategory&quot;:&quot;document&quot;,&quot;DocumentExtension&quot;:&quot;xlsx&quot;,&quot;DocumentFileType&quot;:&quot;Excel spreadsheet&quot;,&quot;DocumentIcon&quot;:&quot;\/_resources\/vendor\/silverstripe\/framework\/client\/images\/app_icons\/document_92.png?m=1788898508&quot;,&quot;DocumentSize&quot;:&quot;840 KB&quot;,&quot;DocumentPreviewImage&quot;:false},{&quot;ID&quot;:&quot;119152&quot;,&quot;ClassName&quot;:&quot;SilverStripe\\Assets\\File&quot;,&quot;Name&quot;:&quot;provisional-weekly-deaths-registered-in-New-Zealand-from-9-January-2000-20-April-2025.xlsx&quot;,&quot;FileName&quot;:&quot;provisional-weekly-deaths-registered-in-New-Zealand-from-9-January-2000-20-April-2025.xlsx&quot;,&quot;Title&quot;:&quot;Provisional weekly deaths registered in New Zealand from 9 January 2000\u2013 20 April 2025&quot;,&quot;ShowInSearch&quot;:1,&quot;ParentID&quot;:118935,&quot;OwnerID&quot;:53,&quot;DocumentLink&quot;:&quot;\/assets\/Uploads\/Births-and-deaths\/Births-and-deaths-Year-ended-March-2025\/Download-data\/provisional-weekly-deaths-registered-in-New-Zealand-from-9-January-2000-20-April-2025.xlsx&quot;,&quot;DocumentCategory&quot;:&quot;document&quot;,&quot;DocumentExtension&quot;:&quot;xlsx&quot;,&quot;DocumentFileType&quot;:&quot;Excel spreadsheet&quot;,&quot;DocumentIcon&quot;:&quot;\/_resources\/vendor\/silverstripe\/framework\/client\/images\/app_icons\/document_92.png?m=1788898508&quot;,&quot;DocumentSize&quot;:&quot;721 KB&quot;,&quot;DocumentPreviewImage&quot;:false}],&quot;Heading&quot;:&quot;Download data&quot;,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}},&quot;Presentation&quot;:null},{&quot;ID&quot;:&quot;128296&quot;,&quot;Title&quot;:&quot;Births and deaths: Year ended March 2025 \u2013 key facts 1&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Key facts&lt;\/h2&gt;\n&lt;p&gt;In the year ended March 2025 compared with the year ended March 2024:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;there were 58,539 live births registered, up from 56,277&lt;\/li&gt;\n&lt;li&gt;there were 37,647 deaths registered, little changed from 37,623&lt;\/li&gt;\n&lt;li&gt;the total fertility rate was 1.58 births per woman, up from 1.54&lt;\/li&gt;\n&lt;li&gt;the infant mortality rate was 6.0 deaths per 1,000 live births, up from 3.8 per 1,000 (the increase is a result of a high number of late registrations during this period, see &lt;a href=\&quot;\/information-releases\/births-and-deaths-year-ended-december-2024-including-abridged-period-life-table\/#lateregistrations\&quot;&gt;Births and deaths: Year ended December 2024 (including abridged period life table)&lt;\/a&gt;).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;h2&gt;Fertility and mortality rates updated following population revisions&lt;\/h2&gt;\n&lt;p&gt;Fertility and mortality rates have been updated following revisions to population estimates between 30 June 2018 and 30 June 2023 as part of the &lt;a href=\&quot;\/information-releases\/estimated-resident-population-2023-base-at-30-june-2023\/\&quot;&gt;Estimated resident population (2023-base): At 30 June 2023&lt;\/a&gt; release.&lt;\/p&gt;\n&lt;p&gt;The total population was revised downwards, while the M\u0101ori population was revised upwards. As a result, fertility and mortality rates have generally increased for the total population, and decreased for the M\u0101ori population, although there are differences to this for different ages or sex.&lt;\/p&gt;\n&lt;h2&gt;Regional fertility rates&lt;\/h2&gt;\n&lt;p&gt;Regional age-specific and total fertility rates have been calculated following the release of the 2023-base estimated resident population (ERP). They are calculated using live births that were registered during 2022\u20132024, relative to the June 2023 ERP. This is the latest available data that can provide this breakdown. The total fertility rate shows the average number of babies that women would have in their life if the age-specific fertility rates in a given period stayed the same throughout their lives.&lt;\/p&gt;\n&lt;p&gt;Gisborne and Northland regions had the highest fertility rate at 2.14 births per woman. Mothers from these regions also had some of the youngest median ages at the time of birth (29.2 and 29.9 years respectively for births registered during 2022\u20132024).&lt;\/p&gt;\n&lt;p&gt;The total fertility rate for Aotearoa New Zealand for births registered in 2022\u20132024 was 1.60 births per woman. The median age of mothers who gave birth over this time was 31.3 years.&lt;\/p&gt;\n&lt;p&gt;Later childbearing can impact the number of births women are likely to have. If the median age is lower in a region, than on average, women from these regions are having children earlier in their reproductive lives. They therefore have the potential to have more children than women who start having children later in their reproductive lives.&lt;\/p&gt;\n&lt;p&gt;Otago and Wellington had the lowest total fertility rate at 1.25 and 1.36 respectively. The median age of mothers from these areas at the time of giving birth was the highest in Aotearoa New Zealand, at 32.2 years in Otago, and 32.1 years in Wellington. Furthermore, regions with large tertiary education providers, such as Otago and Wellington, have large numbers of young women who are within childbearing ages but generally not having children while studying. This means that these regions are likely to have lower fertility rates than other regions.&lt;\/p&gt;\n&lt;p&gt;Total fertility rates in all regions have decreased over the last decade. The largest decrease was in Nelson region, where there were 0.6 fewer births per woman registered in 2022\u20132024 than in 2012\u20132014. The smallest decreases were in Gisborne and Manawat\u016b-Whanganui regions, where there were 0.3 fewer births per woman.&lt;\/p&gt;\n&lt;h2&gt;Ethnic group fertility rates&lt;\/h2&gt;\n&lt;p&gt;Fertility rates by broad ethnic group have been released for the 2022\u20132024 period. The data shows that Pacific and M\u0101ori women are, on average, having more babies than European or Asian women. However, the total fertility rate has decreased for all ethnic groups compared with a decade before (births in 2012\u20132014).&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Pacific women had the highest total fertility rate of 2.03 births per woman, down from 2.73 a decade before.&lt;\/li&gt;\n&lt;li&gt;M\u0101ori women had a fertility rate of 1.97 births per woman, down from 2.49.&lt;\/li&gt;\n&lt;li&gt;European or Other women had a total fertility rate of 1.56 births per woman, down from 1.92.&lt;\/li&gt;\n&lt;li&gt;Asian women had a total fertility rate of 1.32 births per woman, down from 1.69.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;The fertility rate calculations use the estimated resident population at the mid-point of the period, that is, at 30 June 2023 for the 2022\u20132024 period. The population estimates for the period mid-point represent the most recent update of the estimated resident population following the newest census and post-enumeration survey results.&lt;\/p&gt;\n&lt;h2&gt;Cohort fertility rates&lt;\/h2&gt;\n&lt;p&gt;Cohort fertility is another measure of fertility, tracing the fertility experience of women born in a particular year. It measures the average number of births that women born in a particular year have had by the end of their reproductive life.&lt;\/p&gt;\n&lt;p&gt;The cohort fertility series has been updated and is available in Infoshare. It is found under the subject category \u2018Population\u2019 &amp;gt;\u2018Birth Rates \u2013 DFM&#039; &amp;gt;\u2018Cohort fertility, completed fertility rate for women born from 1894 onwards (Annual-Dec)\u2019.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;1684&quot;,&quot;Title&quot;:&quot;Access data in Infoshare \u2013 births and deaths&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Access data in Infoshare
